name: Static code analysis
on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - '**.rst'
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.rst'

jobs:
  check:
    name: Run static code analysis tools
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup python environment
        uses: actions/setup-python@v1
        with:
          python-version: '3.13' 

      - name: Install packages
        run: pip install ansible ansible-lint flake8 yamllint jmespath

      - name: Check python code
        run: flake8 collections/infrastructure collections/management resources/workflow/check_duplicated_files.py --statistics --ignore E501,E226,W503

      - name: Check duplicated WebUI files
        run: python3 resources/workflow/check_duplicated_files.py

      # Note: exclude grafana dashboard for now, to be fixed
      - name: Run ansible linter
        run: ansible-lint collections/
