---
- name: include_vars <|> Gather OS specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "vars/{{ ansible_facts.distribution | replace(' ','_') }}_{{ ansible_facts.distribution_major_version }}.yml"
        - "vars/{{ ansible_facts.os_family }}_{{ ansible_facts.distribution_major_version }}.yml"
        - "vars/{{ ansible_facts.distribution | replace(' ','_') }}.yml"
        - "vars/{{ ansible_facts.os_family }}.yml"
      skip: true
  tags:
    - always

- name: "assert <|> Check google_authenticator_mfa_mode value"
  ansible.builtin.assert:
    that:
      - google_authenticator_mfa_mode in ['publickey', 'password']
    fail_msg: "google_authenticator_mfa_mode must be publickey or password, not {{ google_authenticator_mfa_mode }}"
    quiet: true

- name: "package <|> Install google_authenticator packages"
  ansible.builtin.package:
    name: "{{ google_authenticator_packages_to_install }}"
    state: present
  tags:
    - package

# SSH server: settings are set in a drop-in file, read before the distribution ones

- name: "file <|> Create /etc/ssh/sshd_config.d directory"
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: 0755

- name: "template <|> Generate {{ google_authenticator_sshd_configuration_file }}"
  ansible.builtin.template:
    src: sshd_google_authenticator.conf.j2
    dest: "{{ google_authenticator_sshd_configuration_file }}"
    owner: root
    group: root
    mode: 0600
    validate: /usr/sbin/sshd -t -f %s
  notify: service <|> Restart sshd service
  tags:
    - template

# Previous versions of this role edited /etc/ssh/sshd_config directly
- name: "blockinfile <|> Remove settings of previous role versions from /etc/ssh/sshd_config"
  ansible.builtin.blockinfile:
    path: /etc/ssh/sshd_config
    state: absent
  notify: service <|> Restart sshd service

# PAM: verification code, and password depending on mode

- name: "lineinfile <|> Add google-authenticator module to /etc/pam.d/sshd"
  ansible.builtin.lineinfile:
    path: /etc/pam.d/sshd
    regexp: '^auth\s+required\s+pam_google_authenticator.so'
    line: "auth       required     pam_google_authenticator.so{{ ' nullok' if (google_authenticator_nullok | bool) else '' }}"
    insertafter: '^auth'

- name: "lineinfile <|> Disable password authentication in /etc/pam.d/sshd (publickey mode)"
  ansible.builtin.lineinfile:
    path: /etc/pam.d/sshd
    regexp: "{{ google_authenticator_pam_password_regexp }}"
    line: "#{{ google_authenticator_pam_password_line }}"
  when: google_authenticator_mfa_mode == 'publickey'

- name: "lineinfile <|> Enable password authentication in /etc/pam.d/sshd (password mode)"
  ansible.builtin.lineinfile:
    path: /etc/pam.d/sshd
    regexp: "{{ google_authenticator_pam_password_regexp }}"
    line: "{{ google_authenticator_pam_password_line }}"
    insertbefore: '^auth'
    firstmatch: true
  when: google_authenticator_mfa_mode == 'password'

# In publickey mode, password modules are disabled: google-authenticator is the only auth
# module, and with nullok it ignores users without verification code, which PAM refuses
# when no module succeeds. pam_permit then provides the success for these users.
- name: "lineinfile <|> Allow users without verification code to log in (publickey mode with nullok)"
  ansible.builtin.lineinfile:
    path: /etc/pam.d/sshd
    line: "auth       optional     pam_permit.so"
    insertafter: '^auth\s+required\s+pam_google_authenticator.so'
    state: "{{ 'present' if (google_authenticator_mfa_mode == 'publickey' and (google_authenticator_nullok | bool)) else 'absent' }}"
