---
- name: "package <|> Install pam_slurm_adopt"
  ansible.builtin.package:
    name: "slurm-pam_slurm"
    state: present
  tags:
    - package

- name: "lineinfile <|> Ensure pam_slurm_adopt is configured on PAM ssh rules"
  ansible.builtin.lineinfile:
    path: /etc/pam.d/sshd
    insertafter: '^account'
    line: "-account    required      pam_slurm_adopt.so #bluebanquise managed"

- name: "lineinfile <|> Disable pam_systemd in sshd & system-auth - https://slurm.schedmd.com/pam_slurm_adopt.html"
  ansible.builtin.lineinfile:
    path: "/etc/pam.d/{{ item }}"
    regexp: '^.*pam_systemd\.so.*'
    state: absent
  loop:
    - password-auth
    - system-auth
    - sshd
