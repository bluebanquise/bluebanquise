---
slurm_home_path: /etc/slurm
slurm_mysql_cnf_dir: /etc/mysql/conf.d/
slurm_major_version: 23
slurm_packages_to_install:
  bluebanquise:
    controller:
      - munge
      - libmunge2
      - slurm-smd
      - slurm-smd-dev
      - slurm-smd-slurmctld
      - slurm-smd-client
    accounting:
      - python3-pymysql
      - slurm-smd-slurmdbd
    accounting_mysql:
      - mariadb-client
      - mariadb-server
    compute:
      - munge
      - libmunge2
      - slurm-smd
      - slurm-smd-dev
      - slurm-smd-slurmd
      - slurm-smd-client
      - slurm-smd-libpmi0
      - slurm-smd-libpmi2-0
      - libpmix2
      - libpmix-dev
    submitter:
      - munge
      - libmunge2
      - slurm-smd
      - slurm-smd-dev
      - slurm-smd-client
  # Package names checked on Ubuntu 24.04 (slurm 23.11): slurm-wlm-* daemon
  # packages do not exist, libraries have the t64 suffix
  distribution:
    controller:
      - munge
      - libmunge2
      - slurm-wlm
      - libslurm-dev
      - slurmctld
      - slurm-client
    accounting:
      - python3-pymysql
      - slurmdbd
    accounting_mysql:
      - mariadb-client
      - mariadb-server
    compute:
      - munge
      - libmunge2
      - slurm-wlm
      - libslurm-dev
      - slurmd
      - slurm-client
      - libpmi0t64
      - libpmi2-0t64
      - libpmix2t64
      - libpmix-dev
    submitter:
      - munge
      - libmunge2
      - slurm-wlm
      - libslurm-dev
      - slurm-client
