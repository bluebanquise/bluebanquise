---

- name: cluster_playbooks <|> Ensure /etc/bluebanquise directory exists
  ansible.builtin.file:
    path: /etc/bluebanquise
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: cluster_playbooks <|> Write bluebanquise_playbook.conf
  ansible.builtin.template:
    src: bluebanquise_playbook.conf.j2
    dest: "{{ cluster_playbooks_conf_path }}"
    owner: root
    group: root
    mode: '0644'

- name: cluster_playbooks <|> Ensure storage directory exists
  ansible.builtin.file:
    path: "{{ cluster_playbooks_storage_path }}"
    state: directory
    owner: bluebanquise
    group: bluebanquise
    mode: '0750'

- name: cluster_playbooks <|> Install bluebanquise-playbook CLI tool
  ansible.builtin.copy:
    src: bluebanquise-playbook
    dest: "{{ cluster_playbooks_script_path }}"
    owner: root
    group: root
    mode: '0755'

- name: cluster_playbooks <|> Ensure per-host cluster state directory exists
  ansible.builtin.file:
    path: "{{ cluster_playbooks_hosts_base_path }}"
    state: directory
    owner: bluebanquise
    group: bluebanquise
    mode: '0750'

- name: cluster_playbooks <|> Ensure shared tmp directory exists
  ansible.builtin.file:
    path: "{{ cluster_playbooks_tmp_path }}"
    state: directory
    owner: bluebanquise
    group: bluebanquise
    mode: '0750'

- name: cluster_playbooks <|> Install bluebanquise-cluster-playbooks-daemon script
  ansible.builtin.copy:
    src: bluebanquise-cluster-playbooks-daemon
    dest: "{{ cluster_playbooks_daemon_script_path }}"
    owner: root
    group: root
    mode: '0755'

- name: cluster_playbooks <|> Generate daemon configuration file
  ansible.builtin.template:
    src: cluster_playbooks_daemon.conf.j2
    dest: "{{ cluster_playbooks_daemon_conf_path }}"
    owner: bluebanquise
    group: bluebanquise
    mode: '0640'

- name: cluster_playbooks <|> Install bluebanquise-cluster-playbooks-daemon systemd service
  ansible.builtin.template:
    src: bluebanquise-cluster-playbooks-daemon.service.j2
    dest: /etc/systemd/system/bluebanquise-cluster-playbooks-daemon.service
    owner: root
    group: root
    mode: '0644'

- name: cluster_playbooks <|> Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: "service <|> Manage bluebanquise-cluster-playbooks-daemon state"
  ansible.builtin.service:
    name: "bluebanquise-cluster-playbooks-daemon"
    enabled: "{{ (cluster_playbooks_enable_services | default(bb_enable_services) | default(true) | bool) | ternary(true, false) }}"
    state: "{{ (cluster_playbooks_start_services | default(bb_start_services) | default(true) | bool) | ternary('started', omit) }}"
  tags:
    - service
