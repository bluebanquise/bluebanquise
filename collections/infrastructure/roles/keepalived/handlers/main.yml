---
# Reload: keepalived applies the new configuration without dropping virtual IPs
- name: service <|> Reload keepalived
  ansible.builtin.service:
    name: "{{ item }}"
    state: reloaded
  loop: "{{ keepalived_services_to_start }}"
  when:
    - "'service' not in ansible_skip_tags"
    - keepalived_start_services | default(bb_start_services) | default(true) | bool
