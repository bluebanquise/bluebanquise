---
- name: "package <|> Install {{ keepalived_packages_to_install | join(' ') }}"
  ansible.builtin.package:
    name: "{{ keepalived_packages_to_install }}"
    state: present
  tags:
    - package

- name: firewalld <|> Configure firewall
  when:
    - os_firewall | default(true) | bool
  tags:
    - firewall
  block:
    # VRRP advertisements must reach backups, else all hosts become MASTER
    - name: "firewalld <|> Add services to firewall's zone"
      ansible.posix.firewalld:
        zone: "{{ keepalived_firewall_zone | default(bb_services_firewall_zone, true) | default('public') }}"
        service: "{{ item }}"
        immediate: true
        permanent: true
        state: enabled
      loop: "{{ keepalived_firewall_services_to_add }}"
  rescue:
    - name: fail <|> Firewall configuration failed
      ansible.builtin.fail:
        msg: >-
          Firewall configuration failed: {{ (ansible_failed_result.results | default([]) | selectattr('failed', 'defined') | selectattr('failed') | map(attribute='msg') | list + [ansible_failed_result.msg | default('unknown error')]) | first }}.
          firewalld must be installed and running, with its Python bindings (python3-firewall package),
          for example using the firewall role. Set os_firewall to false to disable firewall configuration.

- name: "template <|> Generate {{ keepalived_conf_file }}"
  ansible.builtin.template:
    src: keepalived.conf.j2
    dest: "{{ keepalived_conf_file }}"
    owner: root
    group: root
    mode: 0644
  notify: service <|> Reload keepalived
  tags:
    - template

- name: "service <|> Manage {{ keepalived_services_to_start | join(' ') }} state"
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: "{{ (keepalived_enable_services | default(bb_enable_services) | default(true) | bool) | ternary(true, false) }}"
    state: "{{ (keepalived_start_services | default(bb_start_services) | default(true) | bool) | ternary('started', omit) }}"
  loop: "{{ keepalived_services_to_start }}"
  tags:
    - service
