---
- name: include_tasks <|> Setup Prometheus
  ansible.builtin.include_tasks: "server_prometheus.yml"
  when: prometheus_server_manage_prometheus | bool
  tags:
    - internal

- name: include_tasks <|> Setup Alertmanager
  ansible.builtin.include_tasks: "server_alertmanager.yml"
  when: prometheus_server_manage_alertmanager | bool
  tags:
    - internal

- name: include_tasks <|> Setup Karma
  ansible.builtin.include_tasks: "server_karma.yml"
  when: prometheus_server_manage_karma | bool
  tags:
    - internal

- name: include_tasks <|> Setup ipmi_exporter
  ansible.builtin.include_tasks: "server_ipmi_exporter.yml"
  when: prometheus_server_manage_ipmi_exporter | bool
  tags:
    - internal

- name: include_tasks <|> Setup snmp_exporter
  ansible.builtin.include_tasks: "server_snmp_exporter.yml"
  when: prometheus_server_manage_snmp_exporter | bool
  tags:
    - internal

- name: include_tasks <|> Setup modbus_exporter
  ansible.builtin.include_tasks: "server_modbus_exporter.yml"
  when: prometheus_server_manage_modbus_exporter | bool
  tags:
    - internal

- name: include_tasks <|> Setup tls and/or basic authentication
  ansible.builtin.include_tasks: "server_security.yml"
  when: prometheus_server_enable_tls | bool or prometheus_server_enable_basic_auth | bool
  tags:
    - internal
