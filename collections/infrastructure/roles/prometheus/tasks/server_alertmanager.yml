---
- name: group <|> Add alertmanager group
  ansible.builtin.group:
    name: alertmanager
    gid: "{{ prometheus_server_alertmanager_user_gid }}"
    state: present

- name: user <|> Add alertmanager user
  ansible.builtin.user:
    name: alertmanager
    shell: /bin/false
    uid: "{{ prometheus_server_alertmanager_user_uid }}"
    group: alertmanager
    home: /var/lib/alertmanager
    state: present

- name: package <|> Install alertmanager package
  ansible.builtin.package:
    name: "{{ prometheus_server_alertmanager_packages_to_install }}"
    state: present
  tags:
    - package

- name: template <|> Generate alertmanager service file
  ansible.builtin.template:
    src: alertmanager.service.j2
    dest: /etc/systemd/system/alertmanager.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - systemd <|> Reload systemd configuration
    - service <|> Restart alertmanager service
  tags:
    - template

- name: firewalld <|> Configure firewall
  when:
    - os_firewall | default(true) | bool
  tags:
    - firewall
  block:
    - name: "firewalld <|> Add alertmanager port to firewall's zone"
      ansible.posix.firewalld:
        zone: "{{ prometheus_server_firewall_zone | default(bb_services_firewall_zone, true) | default('public') }}"
        port: 9093/tcp
        immediate: true
        permanent: true
        state: enabled
      when:
        - prometheus_firewall_open | bool
  rescue:
    - name: fail <|> Firewall configuration failed
      ansible.builtin.fail:
        msg: >-
          Firewall configuration failed: {{ (ansible_failed_result.results | default([]) | selectattr('failed', 'defined') | selectattr('failed') | map(attribute='msg') | list + [ansible_failed_result.msg | default('unknown error')]) | first }}.
          firewalld must be installed and running, with its Python bindings (python3-firewall package),
          for example using the firewall role. Set os_firewall to false to disable firewall configuration.

- name: file <|> Create Alertmanager directories structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: alertmanager
    group: alertmanager
  loop:
    - /etc/alertmanager/

- name: template <|> Generate /etc/alertmanager/alertmanager.yml
  ansible.builtin.template:
    src: alertmanager.yml.j2
    dest: /etc/alertmanager/alertmanager.yml
    owner: alertmanager
    group: alertmanager
    mode: "0640"
    validate: /usr/bin/amtool check-config %s
  notify: service <|> Restart alertmanager service
  tags:
    - template

- name: meta <|> Run handler tasks
  ansible.builtin.meta: flush_handlers

- name: service <|> Manage alertmanager service state
  ansible.builtin.service:
    name: alertmanager
    enabled: "{{ (prometheus_enable_services | default(bb_enable_services) | default(true) | bool) | ternary(true, false) }}"
    state: "{{ (prometheus_start_services | default(bb_start_services) | default(true) | bool) | ternary('started', omit) }}"
  tags:
    - service
