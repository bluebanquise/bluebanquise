---
- name: group <|> Add prometheus group
  ansible.builtin.group:
    name: prometheus
    gid: "{{ prometheus_server_prometheus_user_gid }}"
    state: present

- name: user <|> Add prometheus user
  ansible.builtin.user:
    name: prometheus
    shell: /bin/false
    uid: "{{ prometheus_server_prometheus_user_uid }}"
    group: prometheus
    home: /var/lib/prometheus
    state: present

- name: package <|> Install prometheus package
  ansible.builtin.package:
    name: "{{ prometheus_server_prometheus_packages_to_install }}"
    state: present
  tags:
    - package

- name: template <|> Generate prometheus service file
  ansible.builtin.template:
    src: prometheus.service.j2
    dest: /etc/systemd/system/prometheus.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - systemd <|> Reload systemd configuration
    - service <|> Restart prometheus service
  tags:
    - template

- name: firewalld <|> Configure firewall
  when:
    - os_firewall | default(true) | bool
  tags:
    - firewall
  block:
    - name: "firewalld <|> Add prometheus service to firewall's zone"
      ansible.posix.firewalld:
        zone: "{{ prometheus_server_firewall_zone | default(bb_services_firewall_zone, true) | default('public') }}"
        service: prometheus
        immediate: true
        permanent: true
        state: enabled
      when:
        - prometheus_firewall_open | bool
  rescue:
    - name: fail <|> Firewall configuration failed
      ansible.builtin.fail:
        msg: >-
          Firewall configuration failed: {{ (ansible_failed_result.results | default([]) | selectattr('failed', 'defined') | selectattr('failed') | map(attribute='msg') | list + [ansible_failed_result.msg | default('unknown error')]) | first }}.
          firewalld must be installed and running, with its Python bindings (python3-firewall package),
          for example using the firewall role. Set os_firewall to false to disable firewall configuration.

- name: file <|> Create Prometheus directories structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
    owner: prometheus
    group: prometheus
  loop:
    - /etc/prometheus/
    - /etc/prometheus/alerts/
    - /var/lib/prometheus

- name: template <|> Generate /etc/prometheus/prometheus.yml
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: prometheus
    group: prometheus
    mode: "0640"
    validate: /usr/bin/promtool check config %s
  notify: service <|> Restart prometheus service
  tags:
    - template

- name: copy <|> Copy alerts to /etc/prometheus/alerts/
  ansible.builtin.copy:
    src: alerts/{{ item }}.yml
    dest: /etc/prometheus/alerts/{{ item }}.yml
    owner: prometheus
    group: prometheus
    mode: "0640"
  loop: "{{ ['general'] + prometheus_server_additional_alerts }}"
  notify: service <|> Restart prometheus service

- name: template <|> Generate users alerts to /etc/prometheus/alerts/user_alerts.yml
  ansible.builtin.template:
    src: alerts/user_alerts.yml.j2
    dest: /etc/prometheus/alerts/user_alerts.yml
    owner: prometheus
    group: prometheus
    mode: "0640"
    validate: /usr/bin/promtool check rules %s
  when: prometheus_server_custom_alerts is defined and prometheus_server_custom_alerts is not none
  notify: service <|> Restart prometheus service

- name: meta <|> Run handler tasks
  ansible.builtin.meta: flush_handlers

- name: service <|> Manage prometheus service state
  ansible.builtin.service:
    name: prometheus
    enabled: "{{ (prometheus_enable_services | default(bb_enable_services) | default(true) | bool) | ternary(true, false) }}"
    state: "{{ (prometheus_start_services | default(bb_start_services) | default(true) | bool) | ternary('started', omit) }}"
  tags:
    - service
