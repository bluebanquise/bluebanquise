---

- name: template <|> Generate prometheus web config file
  ansible.builtin.template:
    src: web.yml.j2
    dest: /etc/prometheus/web.yml
    owner: prometheus
    group: prometheus
    mode: "0640"
    validate: /usr/bin/promtool check web-config %s
  notify: service <|> Restart prometheus service
  tags:
    - template
