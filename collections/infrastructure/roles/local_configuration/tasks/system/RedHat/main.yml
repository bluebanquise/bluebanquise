---
- name: package <|> Install grubby
  ansible.builtin.package:
    name: grubby
    state: present

- name: shell <|> Get current kernel parameters
  ansible.builtin.shell: "set -o pipefail && grubby --info=DEFAULT | grep args"
  args:
    executable: /bin/bash
  register: _lc_kernel_config_current_parameters
  changed_when: false

- name: command <|> Update os kernel parameters
  ansible.builtin.command: "grubby --args='{{ item }}' --update-kernel=DEFAULT"
  loop: "{{ (_lc_kernel_parameters | trim).split(' ') | reject('equalto', '') | list }}"
  when:
    - _lc_kernel_parameters | trim | length > 0
    - item not in _lc_kernel_config_current_parameters.stdout

- name: command <|> Update hw kernel parameters
  ansible.builtin.command: "grubby --args='{{ item }}' --update-kernel=DEFAULT"
  loop: "{{ (_lc_hw_kernel_parameters | trim).split(' ') | reject('equalto', '') | list }}"
  when:
    - _lc_hw_kernel_parameters | trim | length > 0
    - item not in _lc_kernel_config_current_parameters.stdout
