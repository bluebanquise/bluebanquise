---
- name: set_fact <|> Resolve effective kernel parameters
  ansible.builtin.set_fact:
    local_configuration_kernel_parameters_list: >-
      {{ (
           ((local_configuration_system | default({})).kernel_parameters | default(os_kernel_parameters) | default('', true) | string).split()
           + ((local_configuration_system | default({})).hw_kernel_parameters | default(hw_kernel_parameters) | default('', true) | string).split()
           + (hw_console | default('', true) | string).split()
         ) | unique }}
    local_configuration_sysctl: >-
      {{ (local_configuration_system | default({})).sysctl
         | default(os_sysctl) | default({}, true) }}
  tags:
    - always

# RedHat: grubby, on all kernels (also used by future kernels). Others: /etc/default/grub.
- name: include_tasks <|> Apply kernel parameters with grubby
  ansible.builtin.include_tasks: system/kernel_parameters_grubby.yml
  when:
    - ansible_facts.os_family == 'RedHat'
    - local_configuration_kernel_parameters_list | length > 0
  tags:
    - always

- name: include_tasks <|> Apply kernel parameters in /etc/default/grub
  ansible.builtin.include_tasks: system/kernel_parameters_grub.yml
  when:
    - ansible_facts.os_family != 'RedHat'
    - local_configuration_kernel_parameters_list | length > 0
  tags:
    - always

- name: sysctl <|> Update sysctl parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: "{{ local_configuration_kernel_config_sysctl_reload | bool }}"
  loop: "{{ local_configuration_sysctl | dict2items }}"
