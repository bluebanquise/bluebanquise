---
- name: package <|> Install grubby
  ansible.builtin.package:
    name: grubby
    state: present
  tags:
    - package

- name: command <|> Get kernel parameters of all boot entries
  ansible.builtin.command: grubby --info=ALL
  register: local_configuration_grubby_info
  changed_when: false
  check_mode: false

# A parameter is added when at least one boot entry does not have it
- name: command <|> Add kernel parameters to all kernels
  ansible.builtin.command: "grubby --update-kernel=ALL --args={{ item }}"
  loop: "{{ local_configuration_kernel_parameters_list }}"
  when:
    - local_configuration_grubby_info.stdout_lines
      | select('match', '^args=')
      | reject('search', '[" ]' ~ (item | regex_escape) ~ '[" ]')
      | list | length > 0
  changed_when: true
