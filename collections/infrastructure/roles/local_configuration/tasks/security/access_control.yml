---
- name: set_fact <|> Resolve effective access control state
  ansible.builtin.set_fact:
    local_configuration_access_control_state: >-
      {{ (local_configuration_security | default({})).access_control
         | default(os_access_control)
         | default(local_configuration_access_control_os_access_control) }}

- name: "package <|> Install {{ local_configuration_access_control_packages_to_install | join(' ') }}"
  ansible.builtin.package:
    name: "{{ local_configuration_access_control_packages_to_install }}"
    state: present
  tags:
    - package

- name: include_tasks <|> Configure SELinux
  ansible.builtin.include_tasks: security/selinux.yml
  when:
    - ansible_facts.os_family == 'RedHat'
  tags:
    - always

- name: include_tasks <|> Configure AppArmor
  ansible.builtin.include_tasks: security/apparmor.yml
  when:
    - ansible_facts.os_family != 'RedHat'
  tags:
    - always
