---
- name: "HA | {{ ha_engine_owner }} | Register '{{ ha_entry.group | default('(ungrouped)') }}'"  # noqa: name[template]
  become: true
  block:

    - name: HA | {{ ha_engine_owner }} | Reset per-entry state  # noqa: name[template]
      ansible.builtin.set_fact:
        ha_engine_group: "{{ ha_entry.group | default('') }}"
        ha_engine_after: "{{ ha_entry.after | default([]) }}"
        ha_engine_members: []
        ha_engine_diff: {}
        ha_engine_constraints: []
        ha_engine_cons_state: []

    # Joiner only: prove the declared join points are already in the group.
    - name: HA | {{ ha_engine_owner }} | Probe group members  # noqa: name[template]
      ansible.builtin.command:
        cmd: pcs resource group list
      register: ha_engine_grp_raw
      changed_when: false
      failed_when: ha_engine_grp_raw.rc not in [0, 1]
      when: ha_engine_after | length > 0

    - name: HA | {{ ha_engine_owner }} | Extract this group's members  # noqa: name[template]
      ansible.builtin.set_fact:
        ha_engine_present: >-
          {{ (ha_engine_grp_raw.stdout_lines | default([])
              | select('search', '^\s*' ~ ha_engine_group ~ ':')
              | map('regex_replace', '^[^:]*:\s*', '')
              | list | first | default('')).split() }}
      when: ha_engine_after | length > 0

    - name: HA | {{ ha_engine_owner }} | Require declared join points to already be in HA  # noqa: name[template]
      ansible.builtin.assert:
        that:
          - ha_engine_grp_raw.rc == 0
          - ha_engine_after | difference(ha_engine_present | default([])) | length == 0
        fail_msg: >-
          ha module {{ ha_engine_owner }} requires
          {{ (ha_engine_after | difference(ha_engine_present | default([]))) | join(', ') }}
          registered in group '{{ ha_engine_group }}' before it can deploy
          (probe_rc={{ ha_engine_grp_raw.rc | default('n/a') }},
          members_seen={{ ha_engine_present | default([]) | join(' ') | default('none', true) }}).
          Run the owner role first.
      when: ha_engine_after | length > 0

    - name: "HA | {{ ha_engine_owner }} | Build members (ha_resources.yml-style: id/type/arguments[/append])"  # noqa: name[template]
      ansible.builtin.set_fact:
        ha_engine_members: >-
          {{ ha_engine_members
             + [ { 'id': item.id,
                   'agent': item.type if ':' in item.type else 'ocf:heartbeat:' ~ item.type,
                   'options': (item.arguments | default(''))
                              | regex_findall('[A-Za-z_][A-Za-z0-9_]*=[^ ]+')
                              | map('replace', "'", '')
                              | map('replace', '"', '')
                              | unique | list,
                   'append': item.append | default('') } ] }}
      loop: "{{ ha_entry.resources }}"
      loop_control:
        label: "{{ item.id | default('?') }}"

    - name: HA | {{ ha_engine_owner }} | Probe declared members  # noqa: name[template]
      ansible.builtin.command:
        cmd: pcs resource config {{ item.id }} --output-format json
      loop: "{{ ha_engine_members }}"
      loop_control:
        label: "{{ item.id }}"
      register: ha_engine_probe
      changed_when: false
      failed_when: ha_engine_probe.rc not in [0, 1]        # rc=1 => create it

    - name: HA | {{ ha_engine_owner }} | Create missing members, each positioned after its predecessor  # noqa: name[template]
      vars:
        _anchor: >-
          {{ (ha_engine_after | last) if (loop_index0 | int) == 0 and ha_engine_after | length > 0
             else (ha_engine_members[(loop_index0 | int) - 1].id if (loop_index0 | int) > 0 else '') }}
      ansible.builtin.command:
        cmd: >-
          pcs resource create {{ item.id }} {{ item.agent }} {{ item.options | join(' ') }}
          {{ item.append | default('') }}
          {{ '--group ' ~ ha_engine_group if ha_engine_group | length > 0 else '' }}
          {{ ' --after ' ~ _anchor
             if ha_engine_group | length > 0 and _anchor | length > 0 else '' }}
      loop: "{{ ha_engine_members }}"
      loop_control:
        index_var: loop_index0
        label: "{{ item.id }}"
      when: (ha_engine_probe.results | zip(ha_engine_members) | selectattr('1.id', 'equalto', item.id)
             | map(attribute='0.rc') | first) == 1
      changed_when: true
      # predecessor always exists here: the join-point assert guaranteed the
      # anchor, earlier members were created earlier in this sequential loop

    # Constraints (order, colocations, locations).
    # Each one is identified in the CIB by its resources (not by its id), and
    # compared on its declared attributes (want), with pacemaker's default
    # for an attribute absent from the CIB (defaults). A missing constraint
    # is created; a differing one is deleted and created again (pcs cannot
    # edit a constraint); an undeclared one is never removed.
    - name: HA | {{ ha_engine_owner }} | Build declared constraints (order)  # noqa: name[template]
      vars:
        _kind: "{{ item.kind | default('Mandatory') }}"
        _sym: "{{ ((item.symmetrical | bool) | ternary('true', 'false')) if item.symmetrical is defined else '' }}"
      ansible.builtin.set_fact:
        ha_engine_constraints: >-
          {{ ha_engine_constraints + [ {
               'label': 'order ' ~ item.start_after ~ ' then ' ~ ha_engine_group ~ ' kind=' ~ _kind
                        ~ ((' symmetrical=' ~ _sym) if _sym | length > 0 else ''),
               'xpath': '//rsc_order[@first="' ~ item.start_after ~ '" and @then="' ~ ha_engine_group ~ '"]',
               'want': {'kind': _kind, 'symmetrical': _sym | default('true', true)},
               'defaults': {'kind': 'Mandatory', 'symmetrical': 'true'},
               'cmd': 'pcs constraint order start ' ~ item.start_after ~ ' then start ' ~ ha_engine_group
                      ~ ' kind=' ~ _kind ~ ((' symmetrical=' ~ _sym) if _sym | length > 0 else '') } ] }}
      loop: "{{ ha_entry.order | default([]) }}"
      loop_control:
        label: "{{ item.start_after }}"

    # "<group> with <with>": pacemaker places <with> (with-rsc, the primary)
    # first, then the group (rsc, the dependent) relative to it.
    - name: HA | {{ ha_engine_owner }} | Build declared constraints (colocations)  # noqa: name[template]
      vars:
        _score: "{{ item.score | default('INFINITY') | string }}"
      ansible.builtin.set_fact:
        ha_engine_constraints: >-
          {{ ha_engine_constraints + [ {
               'label': 'colocation ' ~ ha_engine_group ~ ' with ' ~ item.with ~ ' score=' ~ _score,
               'xpath': '//rsc_colocation[@rsc="' ~ ha_engine_group ~ '" and @with-rsc="' ~ item.with ~ '"]',
               'want': {'score': _score},
               'defaults': {},
               'cmd': 'pcs constraint colocation add ' ~ ha_engine_group ~ ' with ' ~ item.with
                      ~ ' score=' ~ _score } ] }}
      loop: "{{ ha_entry.colocations | default([]) }}"
      loop_control:
        label: "{{ ha_engine_group }} with {{ item.with }}"

    # One constraint per node; "avoids <node>=<score>" is stored by pacemaker
    # as score -<score>.
    - name: HA | {{ ha_engine_owner }} | Build declared constraints (locations)  # noqa: name[template]
      vars:
        _score: "{{ item.0.score | default('INFINITY') | string }}"
        _cib_score: >-
          {{ _score if item.0.type == 'prefers'
             else (_score[1:] if _score.startswith('-') else '-' ~ _score) }}
      ansible.builtin.set_fact:
        ha_engine_constraints: >-
          {{ ha_engine_constraints + [ {
               'label': 'location ' ~ ha_engine_group ~ ' ' ~ item.0.type ~ ' ' ~ item.1 ~ '=' ~ _score,
               'xpath': '//rsc_location[@rsc="' ~ ha_engine_group ~ '" and @node="' ~ item.1 ~ '"]',
               'want': {'score': _cib_score},
               'defaults': {},
               'cmd': 'pcs constraint location ' ~ ha_engine_group ~ ' ' ~ item.0.type ~ ' '
                      ~ item.1 ~ '=' ~ _score } ] }}
      loop: "{{ ha_entry.locations | default([]) | subelements('nodes') }}"
      loop_control:
        label: "{{ item.0.type }} {{ item.1 }}"

    - name: HA | {{ ha_engine_owner }} | Probe declared constraints  # noqa: name[template]
      ansible.builtin.command:
        argv: [cibadmin, --query, --xpath, "{{ item.xpath }}"]
      loop: "{{ ha_engine_constraints }}"
      loop_control:
        label: "{{ item.label }}"
      register: ha_engine_cons_probe
      changed_when: false
      failed_when: ha_engine_cons_probe.rc not in [0, 6, 105]   # 6/105 => not in the CIB

    - name: HA | {{ ha_engine_owner }} | Compare declared constraints with the CIB  # noqa: name[template]
      vars:
        _match: >-
          {% set ns = namespace(ok=true) %}{% for k, v in item.0.want.items() %}{%
          set m = item.1.stdout | regex_search(k ~ '="([^"]*)"', '\\1') %}{%
          set live = (m | first) if m else (item.0.defaults[k] | default('')) %}{%
          if live | string != v | string %}{% set ns.ok = false %}{% endif %}{% endfor %}{{ ns.ok }}
        _ids: >-
          {{ item.1.stdout | regex_findall(' id="([^"]+)"') }}
      ansible.builtin.set_fact:
        ha_engine_cons_state: >-
          {{ ha_engine_cons_state + [ item.0 | combine({
               'present': item.1.rc == 0,
               'match': item.1.rc == 0 and _match | bool,
               'ids': _ids if item.1.rc == 0 else [] }) ] }}
      loop: "{{ ha_engine_constraints | zip(ha_engine_cons_probe.results) | list }}"
      loop_control:
        label: "{{ item.0.label }}"

    - name: HA | {{ ha_engine_owner }} | Delete constraints that differ from the declaration  # noqa: name[template]
      ansible.builtin.command:
        cmd: pcs constraint delete {{ item.1 }}
      loop: "{{ ha_engine_cons_state | selectattr('present') | rejectattr('match') | subelements('ids') }}"
      loop_control:
        label: "{{ item.0.label }} (was {{ item.1 }})"
      changed_when: true

    - name: HA | {{ ha_engine_owner }} | Create missing or differing constraints  # noqa: name[template]
      ansible.builtin.command:
        cmd: "{{ item.cmd }}"
      loop: "{{ ha_engine_cons_state | rejectattr('match') | list }}"
      loop_control:
        label: "{{ item.label }}"
      register: ha_engine_cons_create
      changed_when: ha_engine_cons_create.rc == 0
      # "already exists": an equivalent constraint pcs recognizes but the
      # probe did not (e.g. a resource set), kept as is, like the pcs role.
      failed_when:
        - ha_engine_cons_create.rc != 0
        - "'already exists' not in ha_engine_cons_create.stderr"

    - name: HA | {{ ha_engine_owner }} | Diff declared vs live options (from pcs JSON config)  # noqa: name[template]
      vars:
        _np: >-
          {{ ((item.1.stdout | from_json).primitives | first | default({})).instance_attributes
             | default([]) | map(attribute='nvpairs') | flatten }}
        _live: >-
          {{ _np | map(attribute='name') | zip(_np | map(attribute='value'))
             | map('join', '=') | list }}
      ansible.builtin.set_fact:
        ha_engine_diff: >-
          {{ ha_engine_diff | combine({
            item.0.id: {
              'missing': item.0.options | difference(_live),
              'extra': _live | difference(item.0.options) } }) }}
      loop: "{{ ha_engine_members | zip(ha_engine_probe.results) | list }}"
      loop_control:
        label: "{{ item.0.id }}"
      when: item.1.rc == 0 and (item.0.options | count > 0)

    - name: HA | {{ ha_engine_owner }} | Report drift (missing = to apply, extra = operator-managed, left alone)  # noqa: name[template]
      ansible.builtin.debug:
        msg: >-
          drift on {{ item.key }}:
          will-set [{{ item.value.missing | join(' ') }}]
          {{ '| live-extra (not removed): ' ~ (item.value.extra | join(' '))
             if item.value.extra | length > 0 else '' }}
      loop: "{{ ha_engine_diff | default({}) | dict2items
               | selectattr('value.missing.0', 'defined') | list }}"

    # pcs resource update makes pacemaker restart the changed resource and,
    # in a group, every member after it (group ordering): restarting the
    # systemd members of this group again here would be a second restart.
    # Every other unit of ha_engine_restart_services (ungrouped entry, other
    # group, unit outside the declaration) is restarted by the engine.
    - name: HA | {{ ha_engine_owner }} | Select the restarts pacemaker does not do itself  # noqa: name[template]
      vars:
        _in_group: >-
          {{ (ha_engine_members | map(attribute='agent') | select('match', '^systemd:')
              | map('regex_replace', '^systemd:(.*?)(\.service)?$', '\1') | list)
             if ha_engine_group | length > 0 else [] }}
        _generic: >-
          {{ ha_engine_restart_services
             | zip(ha_engine_restart_services | map('regex_replace', '\.service$', ''))
             | rejectattr('1', 'in', _in_group) | map(attribute='0')
             | map('regex_replace', '^', 'Restart service ') | list }}
        _extra: >-
          {{ ([ha_engine_restart_handler] if ha_engine_restart_handler is string
              else ha_engine_restart_handler) | select | list }}
      ansible.builtin.set_fact:
        ha_engine_notify: "{{ (_generic + _extra) | unique | list }}"

    - name: HA | {{ ha_engine_owner }} | Apply drifted options  # noqa: name[template]
      ansible.builtin.command:
        cmd: >-
          pcs resource update {{ item.key }}
          {{ item.value.missing | map('quote') | join(' ') }}
      loop: "{{ ha_engine_diff | default({}) | dict2items
               | selectattr('value.missing.0', 'defined') | list }}"
      changed_when: true
      notify: "{{ ha_engine_notify }}"

    - name: HA | {{ ha_engine_owner }} | Wait for declared members to start  # noqa: name[template]
      ansible.builtin.command:
        cmd: pcs resource status {{ item.id }}
      loop: "{{ ha_engine_members }}"
      loop_control:
        label: "{{ item.id }}"
      register: ha_engine_started
      changed_when: false
      until: "'Started' in ha_engine_started.stdout or 'Online' in ha_engine_started.stdout"
      retries: 30
      delay: 10
