---
# Label used in validation messages and task output (use the role name).
ha_engine_owner: ha_engine

# Register the declared resources in Pacemaker. Same switch as the Pacemaker
# restart (bb_ha_start_services): true only in the HA playbook after bootstrap,
# so that a non-HA playbook run on an HA inventory, or the HA bootstrap,
# leaves the cluster untouched.
ha_engine_register: "{{ bb_ha_start_services | default(false) | bool }}"

# Inventory group of the HA management nodes. Its first host is the cluster
# writer, the only one that registers resources.
ha_engine_cluster_group: ha_management

# Systemd units to restart (with or without the ".service" suffix).
# One generic handler "Restart service <unit>" is provided per unit.
# Defaults to the units of the "systemd:<unit>" resources of
# ha_engine_declaration (empty when there is none).
ha_engine_restart_services: >-
  {{ ha_engine_declaration | default([])
     | map(attribute='resources', default=[]) | flatten
     | map(attribute='type', default='') | select('match', '^systemd:')
     | map('regex_replace', '^systemd:', '') | unique | list }}

# Restart the unit directly with systemd (non-HA or HA bootstrap).
ha_engine_start_services: "{{ bb_start_services | default(true) | bool }}"

# Restart the unit through Pacemaker (HA cluster, after bootstrap).
# The unit must be managed by a Pacemaker primitive, otherwise the handler fails.
ha_engine_ha_start_services: "{{ bb_ha_start_services | default(false) | bool }}"

# Maximum time (seconds) to wait for the restart to complete, for both
# systemd (task timeout) and Pacemaker (pcs resource restart --wait).
ha_engine_restart_timeout: 300

# Number of extra restart attempts after a failure (0 = no retry), and
# delay (seconds) between two attempts. Each attempt has its own timeout.
# A systemd restart that hits the timeout is not retried (Ansible task
# timeout); a Pacemaker restart that hits it is retried.
ha_engine_restart_retries: 0
ha_engine_restart_delay: 10

# Extra handler name, or list of handler names, always notified after
# drifted options are applied, in addition to the restarts the engine
# selects itself (units of ha_engine_restart_services in ungrouped entries;
# in a group, pacemaker already restarts the members after a changed one).
# Use it to force a restart, e.g. ["Restart service grafana-db"].
ha_engine_restart_handler: []
