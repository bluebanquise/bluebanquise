---
- name: include_vars <|> Gather OS specific variables
  # This task gathers variables defined in OS specific files.
  #
  # Search vars in:
  #  - <distribution>_<major>.yml    # eg. CentOS_8.yml
  #  - <os_family>_<major>.yml       # eg. RedHat_8.yml
  #  - <distribution>.yml            # eg. CentOS.yml
  #  - <os_family>.yml               # eg. RedHat.yml
  #
  # If no OS specific file is found, the role will default to vars/main.yml
  #
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "vars/{{ ansible_facts.distribution | replace(' ','_') }}_{{ ansible_facts.distribution_version }}.yml"
        - "vars/{{ ansible_facts.distribution | replace(' ','_') }}_{{ ansible_facts.distribution_major_version }}.yml"
        - "vars/{{ ansible_facts.os_family }}_{{ ansible_facts.distribution_version }}.yml"
        - "vars/{{ ansible_facts.os_family }}_{{ ansible_facts.distribution_major_version }}.yml"
        - "vars/{{ ansible_facts.distribution | replace(' ','_') }}.yml"
        - "vars/{{ ansible_facts.os_family }}.yml"
      skip: true
  tags:
    - always

- name: package <|> Install MariaDB packages
  ansible.builtin.package:
    name: "{{ mariadb_packages }}"
    state: present

- name: service <|> Ensure MariaDB is running and enabled
  ansible.builtin.service:
    name: mariadb
    enabled: "{{ mariadb_enable_services | default(bb_enable_services) | default(true) | bool }}"
    state: "{{ (mariadb_start_services | default(bb_start_services) | default(true) | bool) | ternary('started', omit) }}"

- name: mysql_user <|> Remove anonymous users
  ansible.mysql.mysql_user:
    name: ""
    host: "{{ item }}"
    state: absent
    login_unix_socket: "{{ mariadb_unix_socket }}"
  loop:
    - localhost
    - "{{ ansible_fqdn }}"

- name: mysql_db <|> Remove test database
  ansible.mysql.mysql_db:
    name: test
    state: absent
    login_unix_socket: "{{ mariadb_unix_socket }}"

# Must run last: setting the root password switches root@localhost away from
# unix_socket auth, so any later task connecting via bare login_unix_socket
# (no login_user/login_password) would be rejected with "Access denied...
# (using password: NO)". host_all (rather than looping over host: localhost/
# 127.0.0.1/::1) updates every matching root account through the single
# socket connection made before that switch happens, instead of one
# connection per loop iteration where only the first would still authenticate.
- name: mysql_user <|> Set MariaDB root password
  ansible.mysql.mysql_user:
    name: root
    password: "{{ mariadb_root_password }}"
    host_all: true
    priv: "*.*:ALL,GRANT"
    state: present
    login_unix_socket: "{{ mariadb_unix_socket }}"
  no_log: true
