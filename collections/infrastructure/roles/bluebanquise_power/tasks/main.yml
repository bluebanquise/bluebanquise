---
- name: "package <|> Install packages"
  ansible.builtin.package:
    name: "{{ bluebanquise_power_packages_to_install }}"
    state: present
  tags:
    - package

# Code and directories are owned by root: they are executed by root and other users, so they must
# not be writable by an unprivileged account. Only the configuration file (BMC credentials) is
# readable by the bluebanquise group, which allows bluebanquise user to run the tool without root.
- name: "file <|> Create directories structure"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: 0755
    owner: root
    group: root
  loop:
    - /etc/bluebanquise/
    - /etc/bluebanquise/bluebanquise-power/
    - /usr/lib/bluebanquise/
    - /usr/lib/bluebanquise/bluebanquise-power/
    - /usr/lib/bluebanquise/bluebanquise-power/plugins/

- name: "template <|> Render configuration"
  ansible.builtin.template:
    src: "bluebanquise-power.yml.j2"
    dest: "/etc/bluebanquise/bluebanquise-power/bluebanquise-power.yml"
    owner: root
    group: bluebanquise
    mode: 0640
  tags:
    - template

# The tool runs with the bluebanquise-venv interpreter, set in its first line (shebang)
- name: "copy <|> Copy executable file"
  ansible.builtin.copy:
    src: "bluebanquise_power.py"
    dest: "/usr/bin/bluebanquise-power"
    owner: root
    group: root
    mode: 0755

- name: "file <|> Create bbp shortcut symlink"
  ansible.builtin.file:
    src: "/usr/bin/bluebanquise-power"
    dest: "/usr/bin/bbp"
    state: link
    owner: root
    group: root
    force: true

# All files of the plugins folder are copied, so a new protocol plugin only needs to be added there
- name: "copy <|> Copy plugin files"
  ansible.builtin.copy:
    src: "plugins/"
    dest: "/usr/lib/bluebanquise/bluebanquise-power/plugins/"
    owner: root
    group: root
    mode: 0644
