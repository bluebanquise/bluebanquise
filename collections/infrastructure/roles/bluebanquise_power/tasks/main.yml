---
- name: "package <|> Install packages"
  ansible.builtin.package:
    name: "{{ bluebanquise_power_packages_to_install }}"
    state: present
  tags:
    - package

# The configuration file holds every BMC password: it is readable by the bluebanquise-power group
# only, a group for this file and nothing else. Its members can run the tool without root.
- name: "group <|> Create bluebanquise-power group"
  ansible.builtin.group:
    name: bluebanquise-power
    system: true

- name: "getent <|> Read users"
  ansible.builtin.getent:
    database: passwd

- name: "user <|> Add users to bluebanquise-power group"
  ansible.builtin.user:
    name: "{{ item }}"
    groups:
      - bluebanquise-power
    append: true
  loop: "{{ bluebanquise_power_users }}"
  when: item in ansible_facts.getent_passwd

# Code and directories are owned by root: they are executed by root and other users, so they must
# not be writable by an unprivileged account.
- name: "file <|> Create directories structure"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: 0755
    owner: root
    group: root
  loop:
    - /etc/bluebanquise/
    - /etc/bluebanquise/bluebanquise-power/
    - /usr/lib/bluebanquise/
    - /usr/lib/bluebanquise/bluebanquise-power/
    - /usr/lib/bluebanquise/bluebanquise-power/plugins/

- name: "template <|> Render configuration"
  ansible.builtin.template:
    src: "bluebanquise-power.yml.j2"
    dest: "/etc/bluebanquise/bluebanquise-power/bluebanquise-power.yml"
    owner: root
    group: bluebanquise-power
    mode: 0640
  tags:
    - template

# The tool runs with the bluebanquise-venv interpreter, set in its first line (shebang)
- name: "copy <|> Copy executable file"
  ansible.builtin.copy:
    src: "bluebanquise_power.py"
    dest: "/usr/bin/bluebanquise-power"
    owner: root
    group: root
    mode: 0755

- name: "file <|> Create bbp shortcut symlink"
  ansible.builtin.file:
    src: "/usr/bin/bluebanquise-power"
    dest: "/usr/bin/bbp"
    state: link
    owner: root
    group: root
    force: true

# All files of the plugins folder are copied, so a new protocol plugin only needs to be added there
- name: "copy <|> Copy plugin files"
  ansible.builtin.copy:
    src: "plugins/"
    dest: "/usr/lib/bluebanquise/bluebanquise-power/plugins/"
    owner: root
    group: root
    mode: 0644
