---
# powermand runs as daemon user, or powerman user on Suse
- name: set_fact <|> Set powerman daemon group
  ansible.builtin.set_fact:
    powerman_daemon_group: "{{ 'powerman' if ansible_facts.os_family == 'Suse' else 'daemon' }}"

- name: "package <|> Install {{ powerman_packages_to_install | join(' ') }}"
  ansible.builtin.package:
    name: "{{ powerman_packages_to_install }}"
    state: present
  tags:
    - package

# Contains BMC passwords: only readable by powerman daemon
- name: template <|> Generate /etc/powerman/powerman.conf
  ansible.builtin.template:
    src: powerman.conf.j2
    dest: /etc/powerman/powerman.conf
    owner: root
    group: "{{ powerman_daemon_group }}"
    mode: "0640"
  notify: service <|> Restart powerman
  tags:
    - template

- name: meta <|> Run handler tasks to restart powerman service
  ansible.builtin.meta: flush_handlers

- name: service <|> Manage powerman state
  ansible.builtin.service:
    name: powerman
    enabled: "{{ (powerman_enable_services | default(bb_enable_services) | default(true) | bool) | ternary(true, false) }}"
    state: "{{ (powerman_start_services | default(bb_start_services) | default(true) | bool) | ternary('started', omit) }}"
  tags:
    - service
