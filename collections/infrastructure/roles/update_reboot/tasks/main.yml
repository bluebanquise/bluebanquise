---
- name: package <|> Upgrade all packages # noqa package-latest
  ansible.builtin.package:
    name: "*"
    state: latest
  when: update_reboot_upgrade_packages | bool
  register: update_reboot_packages_update

- name: reboot <|> Reboot system to run latest kernel
  ansible.builtin.reboot:
    reboot_timeout: "{{ update_reboot_reboot_timeout }}"
  when:
    - update_reboot_reboot | bool
    - update_reboot_packages_update is changed
