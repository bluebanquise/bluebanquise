---
# Reload applies the permanent configuration, and keeps connections state
- name: service <|> Reload firewall services
  ansible.builtin.service:
    name: "{{ item }}"
    state: reloaded
  loop: "{{ firewall_services_to_start }}"
  when:
    - "'service' not in ansible_skip_tags"
    - firewall_start_services | default(bb_start_services) | default(true) | bool
