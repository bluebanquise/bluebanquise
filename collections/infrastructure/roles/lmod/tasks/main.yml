---
- name: include_vars <|> Gather OS specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "vars/{{ ansible_facts.distribution | replace(' ','_') }}_{{ ansible_facts.distribution_major_version }}.yml"
        - "vars/{{ ansible_facts.os_family }}_{{ ansible_facts.distribution_major_version }}.yml"
        - "vars/{{ ansible_facts.distribution | replace(' ','_') }}.yml"
        - "vars/{{ ansible_facts.os_family }}.yml"
      skip: true
  tags:
    - always

- name: "package <|> Install {{ lmod_packages_to_install | join(' ') }}"
  ansible.builtin.package:
    name: "{{ lmod_packages_to_install }}"
    state: present
  tags:
    - package

- name: template <|> Generate /etc/profile.d/modules_extra_path.sh
  ansible.builtin.template:
    src: modules_extra_path.sh.j2
    dest: /etc/profile.d/modules_extra_path.sh
    owner: root
    group: root
    mode: 0644
  when:
    - lmod_path | default([], true) | length > 0
  tags:
    - template

- name: file <|> Remove /etc/profile.d/modules_extra_path.sh
  ansible.builtin.file:
    path: /etc/profile.d/modules_extra_path.sh
    state: absent
  when:
    - lmod_path | default([], true) | length == 0
  tags:
    - template
