---
- name: include_vars <|> Gather OS specific variables
  # This task gathers variables defined in OS specific files.
  #
  # Search vars in:
  #  - <distribution>_<major>.yml    # eg. CentOS_8.yml
  #  - <os_family>_<major>.yml       # eg. RedHat_8.yml
  #  - <distribution>.yml            # eg. CentOS.yml
  #  - <os_family>.yml               # eg. RedHat.yml
  #
  # If no OS specific file is found, the role will default to vars/main.yml
  #
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "vars/{{ ansible_facts.distribution | replace(' ','_') }}_{{ ansible_facts.distribution_version }}.yml"
        - "vars/{{ ansible_facts.distribution | replace(' ','_') }}_{{ ansible_facts.distribution_major_version }}.yml"
        - "vars/{{ ansible_facts.os_family }}_{{ ansible_facts.distribution_version }}.yml"
        - "vars/{{ ansible_facts.os_family }}_{{ ansible_facts.distribution_major_version }}.yml"
        - "vars/{{ ansible_facts.distribution | replace(' ','_') }}.yml"
        - "vars/{{ ansible_facts.os_family }}.yml"
      skip: true
  tags:
    - always

- name: "package <|> Install {{ sshd_server_packages_to_install | join(' ') }}"
  ansible.builtin.package:
    name: "{{ sshd_server_packages_to_install }}"
    state: present
  tags:
    - package

- name: firewalld <|> Configure firewall
  when:
    - os_firewall | default(true) | bool
  tags:
    - firewall
  block:
    - name: "firewalld <|> Add services to firewall's zone"
      ansible.posix.firewalld:
        zone: "{{ sshd_server_firewall_zone | default(bb_services_firewall_zone, true) | default('public') }}"
        service: "{{ item }}"
        immediate: true
        permanent: true
        state: enabled
      loop: "{{ sshd_server_firewall_services_to_add }}"
  rescue:
    - name: fail <|> Firewall configuration failed
      ansible.builtin.fail:
        msg: >-
          Firewall configuration failed: {{ (ansible_failed_result.results | default([]) | selectattr('failed', 'defined') | selectattr('failed') | map(attribute='msg') | list + [ansible_failed_result.msg | default('unknown error')]) | first }}.
          firewalld must be installed and running, with its Python bindings (python3-firewall package),
          for example using the firewall role. Set os_firewall to false to disable firewall configuration.

# On OpenSuse Leap 16, the distribution configuration is /usr/etc/ssh/sshd_config, which includes
# /etc/ssh/sshd_config.d/*.conf: /etc/ssh/sshd_config must then not be created.
- name: stat <|> Check for /etc/ssh/sshd_config
  ansible.builtin.stat:
    path: /etc/ssh/sshd_config
  register: sshd_main_config

- name: lineinfile <|> Include /etc/ssh/sshd_config.d/*.conf in sshd_config
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^Include /etc/ssh/sshd_config\.d/\*\.conf'
    line: "Include /etc/ssh/sshd_config.d/*.conf"
    insertbefore: BOF
  notify: service <|> Restart sshd server
  when: sshd_main_config.stat.exists

- name: "file <|> Create needed directory /etc/ssh/sshd_config.d/"
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/
    state: directory
    owner: root
    group: root
    mode: "0755"

# Files are read in alphabetical order and the first value of a setting wins: 00- makes these settings
# take precedence over distribution ones (for example 50-cloud-init.conf on Ubuntu).
- name: "file <|> Remove sshd configuration of previous role versions"
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/bluebanquise.conf
    state: absent
  notify: service <|> Restart sshd server

- name: "template <|> Generate /etc/ssh/sshd_config.d/00-bluebanquise.conf"
  ansible.builtin.template:
    src: bluebanquise.conf.j2
    dest: /etc/ssh/sshd_config.d/00-bluebanquise.conf
    owner: root
    group: root
    mode: "0600"
  notify: service <|> Restart sshd server
  tags:
    - template

- name: meta <|> Run handler tasks to restart sshd services
  ansible.builtin.meta: flush_handlers

- name: "service <|> Manage {{ sshd_server_services_to_start | join(' ') }} state"
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: "{{ (sshd_server_enable_services | default(bb_enable_services) | default(true) | bool) | ternary(true, false) }}"
    state: "{{ (sshd_server_start_services | default(bb_start_services) | default(true) | bool) | ternary('started', omit) }}"
  loop: "{{ sshd_server_services_to_start }}"
  tags:
    - service
