---
# The configuration is written for the user running Ansible (sudo user), or root
- name: getent <|> Get admin user information
  ansible.builtin.getent:
    database: passwd
    key: "{{ ansible_facts.env.SUDO_USER | default('root', true) }}"

- name: set_fact <|> Set admin user home, uid and gid
  ansible.builtin.set_fact:
    ssh_client_admin_user_home: "{{ getent_passwd[ansible_facts.env.SUDO_USER | default('root', true)][4] }}"
    ssh_client_admin_user_uid: "{{ getent_passwd[ansible_facts.env.SUDO_USER | default('root', true)][1] }}"
    ssh_client_admin_user_gid: "{{ getent_passwd[ansible_facts.env.SUDO_USER | default('root', true)][2] }}"

- name: "file <|> Create {{ ssh_client_admin_user_home }}/.ssh"
  ansible.builtin.file:
    path: "{{ ssh_client_admin_user_home }}/.ssh"
    state: directory
    owner: "{{ ssh_client_admin_user_uid }}"
    group: "{{ ssh_client_admin_user_gid }}"
    mode: "0700"

- name: "template <|> Generate {{ ssh_client_admin_user_home }}/.ssh/config"
  ansible.builtin.template:
    src: config.j2
    dest: "{{ ssh_client_admin_user_home }}/.ssh/config"
    owner: "{{ ssh_client_admin_user_uid }}"
    group: "{{ ssh_client_admin_user_gid }}"
    mode: "0600"
  tags:
    - template
