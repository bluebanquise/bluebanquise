---
### Lease database ###
dhcp_server_lease_file: kea-leases4.csv

### Lease times ###
# Consider increasing these values once cluster is in production.
dhcp_server_default_lease_time: 600
dhcp_server_max_lease_time: 7200

### iPXE Rom settings ###
# These default should suit most hardware.
# Refer to README for possible values.
dhcp_server_ipxe_driver: snponly
dhcp_server_ipxe_embed: dhcpretry

### Enable and/or start services ###
# These values can be set in inventory to manipulate
# services behavior. If not set, default to true for both.
# Roles variables precedence global ones:
# dhcp_server_start_services > bb_start_services > default(true)
# dhcp_server_enable_services > bb_enable_services > default(true)

# dhcp_server_start_services:
# dhcp_server_enable_services:

### Others ###
# Domain name provided by dhcp to clients
# Precedence: dhcp_server_domain_name > bb_domain_name > cluster.local
dhcp_server_domain_name:

# Interfaces the DHCP server listens on ("*" for all)
dhcp_server_listen_interfaces:
  - "*"

# Identify clients leases by their MAC address only, ignoring client identifier (option 61).
# Can be overridden per network using dhcp_match_client_id key. See README.
dhcp_server_match_client_id: false

# Kea log severity: FATAL, ERROR, WARN, INFO or DEBUG
dhcp_server_log_severity: INFO

dhcp_server_firewall_services_to_add:
  - dhcp
