---
- name: include_vars <|> Gather OS specific variables
  # This task gathers variables defined in OS specific files.
  #
  # Search vars in:
  #  - <distribution>_<major>.yml    # eg. CentOS_8.yml
  #  - <os_family>_<major>.yml       # eg. RedHat_8.yml
  #  - <distribution>.yml            # eg. CentOS.yml
  #  - <os_family>.yml               # eg. RedHat.yml
  #
  # If no OS specific file is found, the role will default to vars/main.yml
  #
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "vars/{{ ansible_facts.distribution | replace(' ','_') }}_{{ ansible_facts.distribution_version }}.yml"
        - "vars/{{ ansible_facts.distribution | replace(' ','_') }}_{{ ansible_facts.distribution_major_version }}.yml"
        - "vars/{{ ansible_facts.os_family }}_{{ ansible_facts.distribution_version }}.yml"
        - "vars/{{ ansible_facts.os_family }}_{{ ansible_facts.distribution_major_version }}.yml"
        - "vars/{{ ansible_facts.distribution | replace(' ','_') }}.yml"
        - "vars/{{ ansible_facts.os_family }}.yml"
      skip: true
  tags:
    - always

- name: firewalld <|> Configure firewall
  when:
    - os_firewall | default(true) | bool
  tags:
    - firewall
  block:
    - name: "firewalld <|> Add services to firewall's zone"
      ansible.posix.firewalld:
        zone: "{{ dhcp_server_firewall_zone | default(bb_services_firewall_zone, true) | default('public') }}"
        service: "{{ item }}"
        immediate: true
        permanent: true
        state: enabled
      loop: "{{ dhcp_server_firewall_services_to_add }}"
  rescue:
    - name: fail <|> Firewall configuration failed
      ansible.builtin.fail:
        msg: >-
          Firewall configuration failed: {{ (ansible_failed_result.results | default([]) | selectattr('failed', 'defined') | selectattr('failed') | map(attribute='msg') | list + [ansible_failed_result.msg | default('unknown error')]) | first }}.
          firewalld must be installed and running, with its Python bindings (python3-firewall package),
          for example using the firewall role. Set os_firewall to false to disable firewall configuration.

- name: "package <|> Install {{ dhcp_server_packages_to_install | join(' ') }}"
  ansible.builtin.package:
    name: "{{ dhcp_server_packages_to_install }}"
    state: present
  tags:
    - package

- name: "file <|> Create {{ dhcp_server_conf_dir }}"
  ansible.builtin.file:
    path: "{{ dhcp_server_conf_dir }}"
    owner: root
    group: root
    mode: "0755"
    state: directory

# This calculation takes time, so we store it in memory for later usage
- name: set_fact <|> Calculate hosts interfaces by network
  ansible.builtin.set_fact:
    dhcp_server_hosts_by_network: "{{ hostvars | bluebanquise.infrastructure.hosts_by_network(groups[(dhcp_server_restrict_to_group | default(bb_restrict_to_group, true) | default('all', true))]) }}"
  run_once: true
  tags:
    - template

# Networks served are management networks (net- prefix), with a subnet and a prefix,
# and without dhcp_server set to false.
- name: set_fact <|> Initialize list of networks served by the DHCP server
  ansible.builtin.set_fact:
    dhcp_server_networks: []
  tags:
    - template

- name: set_fact <|> List networks served by the DHCP server
  ansible.builtin.set_fact:
    dhcp_server_networks: "{{ dhcp_server_networks + [item] }}"
  loop: "{{ (networks | default({})).keys() | list }}"
  when:
    - item.startswith('net-')
    - networks[item]['dhcp_server'] | default(true) | bool
    - networks[item]['subnet'] is defined
    - networks[item]['prefix'] is defined
  tags:
    - template

- name: "template <|> Render kea-dhcp4.networks.conf"
  ansible.builtin.template:
    src: "kea-dhcp4.networks.conf.j2"
    dest: "{{ dhcp_server_conf_dir }}/kea-dhcp4.networks.conf"
    owner: root
    group: root
    mode: 0644
  notify: service <|> Restart dhcp server
  tags:
    - template

- name: "template <|> Render networks reservations"
  ansible.builtin.template:
    src: "kea-dhcp4.subnet.conf.j2"
    dest: "{{ dhcp_server_conf_dir }}/kea-dhcp4.{{ item }}.conf"
    owner: root
    group: root
    mode: 0644
  loop: "{{ dhcp_server_networks }}"
  notify: service <|> Restart dhcp server
  tags:
    - template

# Main file is rendered last and includes all other files: its validation checks the whole configuration.
- name: "template <|> Render kea-dhcp4.conf"
  ansible.builtin.template:
    src: "kea-dhcp4.conf.j2"
    dest: "{{ dhcp_server_conf_dir }}/kea-dhcp4.conf"
    owner: root
    group: root
    mode: 0644
    validate: "/usr/sbin/kea-dhcp4 -t %s"
  notify: service <|> Restart dhcp server
  tags:
    - template

- name: meta <|> Run handler tasks to restart dhcp services
  ansible.builtin.meta: flush_handlers

- name: "service <|> Manage {{ dhcp_server_services_to_start | join(' ') }} state"
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: "{{ (dhcp_server_enable_services | default(bb_enable_services) | default(true) | bool) | ternary(true, false) }}"
    state: "{{ (dhcp_server_start_services | default(bb_start_services) | default(true) | bool) | ternary('started', omit) }}"
  loop: "{{ dhcp_server_services_to_start }}"
  tags:
    - service
