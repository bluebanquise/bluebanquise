---
# Keys are authorized for the user running Ansible (sudo user), or root
- name: authorized_key <|> Add authorized keys
  ansible.posix.authorized_key:
    user: "{{ ansible_facts.env.SUDO_USER | default('root', true) }}"
    key: "{{ item }}"
    exclusive: false
    state: present
  loop: "{{ os_admin_ssh_keys | default(ssh_remote_keys_os_admin_ssh_keys, true) | flatten(levels=1) }}"
