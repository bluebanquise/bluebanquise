---
# Handlers run in the order they are defined in this file: systemd configuration
# must be reloaded before conman is restarted with a new drop-in.
- name: systemd <|> Reload systemd configuration
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - "'service' not in ansible_skip_tags"

- name: service <|> Restart conman
  ansible.builtin.service:
    name: conman
    state: restarted
  when:
    - "'service' not in ansible_skip_tags"
    - conman_start_services | default(bb_start_services) | default(true) | bool
