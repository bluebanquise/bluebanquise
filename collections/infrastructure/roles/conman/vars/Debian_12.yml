---
# Debian 12 ships conman 0.2.7, which installs its scripts in /usr/lib
conman_execpath: "/usr/lib/conman/exec"

# expect runs the console scripts (ipmitool.exp, ssh.exp): the package only suggests it
conman_packages_to_install:
  - conman
  - ipmitool
  - expect

# The package logrotate file is a commented example: console logs were never rotated
conman_logrotate_replace_package_file: true
