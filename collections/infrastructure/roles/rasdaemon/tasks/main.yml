---
- name: "package <|> Install rasdaemon"
  ansible.builtin.package:
    name: rasdaemon
    state: present
  tags:
    - package

- name: "service <|> Manage rasdaemon state"
  ansible.builtin.service:
    name: rasdaemon
    enabled: "{{ (rasdaemon_enable_services | default(bb_enable_services) | default(true) | bool) | ternary(true, false) }}"
    state: "{{ (rasdaemon_start_services | default(bb_start_services) | default(true) | bool) | ternary('started', omit) }}"
  tags:
    - service
