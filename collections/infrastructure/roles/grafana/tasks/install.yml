---
- name: install <|> Add grafana group
  ansible.builtin.group:
    name: grafana
    gid: "{{ grafana_user_gid }}"
    state: present
  when: grafana_user_gid|int

- name: install <|> Add grafana user
  ansible.builtin.user:
    name: grafana
    shell: /bin/false
    uid: "{{ grafana_user_uid }}"
    group: grafana
    system: True
    state: present
  when: grafana_user_uid|int

- name: install <|> Check for log file
  ansible.builtin.stat:
    path: "{{ grafana_logs_dir }}"
  register: log_exists

- name: install <|> Change log owner
  ansible.builtin.file:
    path: "{{ grafana_logs_dir }}"
    owner: "grafana"
    group: "grafana"
  when: log_exists.stat.exists

- name: "install <|> Add services to firewall's {{ grafana_firewall_zone | default('public') }} zone"
  ansible.posix.firewalld:
    zone: "{{ grafana_firewall_zone | default('public') }}"
    service: "{{ item }}"
    immediate: "yes"
    permanent: "yes"
    state: enabled
  when:
    - ansible_facts.os_family == "RedHat"
    - os_firewall | default(false) | bool
    - grafana_port == grafana_default_port
  loop: "{{ grafana_firewall_services_to_add }}"
  tags:
    - firewall

- name: "install ¦ Add custom grafana port to firewall's {{ grafana_firewall_zone | default('public') }} zone"
  ansible.posix.firewalld:
    zone: "{{ grafana_firewall_zone | default('public') }}"
    port: "{{ grafana_port }}/tcp"
    immediate: "yes"
    permanent: "yes"
    state: enabled
  when:
    - ansible_facts.os_family == "RedHat"
    - os_firewall | default(false) | bool
    - grafana_port != grafana_default_port
  tags:
    - firewall

- name: "install <|> Install {{ grafana_packages_to_install | join(' ') }} packages"
  ansible.builtin.package:
    name: "{{ grafana_packages_to_install }}"
    state: present
  when: not grafana_install_oss_packages
  tags:
    - install

- name: "install <|> import grafana gpg key"
  ansible.builtin.rpm_key:
    key: https://rpm.grafana.com/gpg.key
    state: present
  when: grafana_install_oss_packages
  tags:
    - install

- name: "install <|> Install {{ grafana_packages_to_install | join(' ') }} OSS packages"
  ansible.builtin.package:
    name: "https://dl.grafana.com/oss/release/{{ item }}"
    state: present
  when: grafana_install_oss_packages
  loop: "{{ grafana_packages_to_install }}"
  tags:
    - install

- name: install <|> Create encryption file for grafana admin
  ansible.builtin.command:
    argv:
      - systemd-creds
      - encrypt
      - --name={{ grafana_admin_cred_name }}
      - "-"
      - "{{ grafana_admin_cred_file }}"
    stdin: "{{ grafana_security.admin_password }}"
    stdin_add_newline: false
  tags:
    - install

- name: install <|> Ensure only grafana user can read the admin password encryption file
  file:
    path: "{{ grafana_admin_cred_file }}"
    mode: "0400"
    owner: grafana
  tags:
    - install

- name: install <|> Create encryption file for grafana db user
  ansible.builtin.command:
    argv:
      - systemd-creds
      - encrypt
      - --name={{ grafana_db_cred_name }}
      - "-"
      - "{{ grafana_db_cred_file }}"
    stdin: "{{ grafana_database.password }}"
    stdin_add_newline: false
  tags:
    - install

- name: install <|> Ensure only grafana user can read the db password encryption file
  file:
    path: "{{ grafana_db_cred_file }}"
    mode: "0400"
    owner: grafana
  tags:
    - install

- name: install <|> Create directory /etc/systemd/system/grafana-server.service.d/
  ansible.builtin.file:
    state: directory
    path: /etc/systemd/system/grafana-server.service.d
    mode: "0755"
  tags:
    - install

- name: install <|> Create grafana-server systemd override for loading credentials
  qansible.builtin.copy:
    dest: /etc/systemd/system/grafana-server.service.d/override.conf
    content: |
      [Service]
      LoadCredentialEncrypted={{ grafana_admin_cred_name }}:{{ grafana_admin_cred_file }}
      Environment=GF_SECURITY_ADMIN_PASSWORD=$__file{{ '{%d/' ~ grafana_admin_cred_name ~ '}' }}
      LoadCredentialEncrypted={{ grafana_db_cred_name }}:{{ grafana_db_cred_file }}
      Environment=GF_DATABASE_PASSWORD=$__file{{ '{%d/' ~ grafana_db_cred_name ~ '}' }}
    mode: "0644"
  notify: Reload systemd daemon
  tags:
    - install

- name: service <|> Manage grafana-server state
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: "{{ (grafana_enable_services | default(bb_enable_services) | default(true) | bool) | ternary('yes', 'no') }}"
    state: "{{ (grafana_start_services | default(bb_start_services) | default(true) | bool) | ternary('started', omit) }}"
  loop: "{{ grafana_services_to_start }}"
  register: service_results
  retries: 5
  delay: 10
  until: service_results is not failed
  tags:
    - service
