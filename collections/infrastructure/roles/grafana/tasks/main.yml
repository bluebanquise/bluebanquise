---
- name: assert <|> Check that variables of previous role versions are not used
  ansible.builtin.assert:
    that:
      - grafana_legacy_variables | length == 0
    fail_msg: >-
      Variables {{ grafana_legacy_variables | join(', ') }} are not supported anymore since grafana role 3.0.0.
      Set grafana.ini options in grafana_configuration instead, see the role README.
    quiet: true
  vars:
    grafana_legacy_variables: "{{ lookup('ansible.builtin.varnames', grafana_legacy_variables_regex, wantlist=true) }}"
  tags:
    - always

- name: set_fact <|> Compute grafana.ini configuration
  ansible.builtin.set_fact:
    grafana_ini: "{{ grafana_base_configuration }}"
  tags:
    - always

- name: set_fact <|> Enable LDAP authentication
  ansible.builtin.set_fact:
    grafana_ini: "{{ grafana_ini | combine(grafana_ldap_base_configuration, recursive=true) }}"
  when:
    - grafana_ldap_configuration | length > 0
  tags:
    - always

- name: set_fact <|> Add grafana_configuration
  ansible.builtin.set_fact:
    grafana_ini: "{{ grafana_ini | combine(grafana_configuration, recursive=true) }}"
  tags:
    - always

- name: firewalld <|> Configure firewall
  when:
    - os_firewall | default(true) | bool
  tags:
    - firewall
  block:
    - name: "firewalld <|> Add grafana port to firewall's zone"
      ansible.posix.firewalld:
        zone: "{{ grafana_firewall_zone | default(bb_services_firewall_zone, true) | default('public') }}"
        port: "{{ grafana_port }}/tcp"
        immediate: true
        permanent: true
        state: enabled
  rescue:
    - name: fail <|> Firewall configuration failed
      ansible.builtin.fail:
        msg: >-
          Firewall configuration failed: {{ (ansible_failed_result.results | default([]) | selectattr('failed', 'defined') | selectattr('failed') | map(attribute='msg') | list + [ansible_failed_result.msg | default('unknown error')]) | first }}.
          firewalld must be installed and running, with its Python bindings (python3-firewall package),
          for example using the firewall role. Set os_firewall to false to disable firewall configuration.

- name: "package <|> Install {{ grafana_packages_to_install | join(' ') }}"
  ansible.builtin.package:
    name: "{{ grafana_packages_to_install }}"
    state: present
  tags:
    - package

# Configuration

- name: template <|> Generate /etc/grafana/grafana.ini
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: /etc/grafana/grafana.ini
    owner: root
    group: grafana
    mode: 0640
  no_log: true
  notify: service <|> Restart grafana
  tags:
    - template

- name: copy <|> Generate /etc/grafana/ldap.toml
  ansible.builtin.copy:
    content: "{{ grafana_ldap_configuration }}"
    dest: /etc/grafana/ldap.toml
    owner: root
    group: grafana
    mode: 0640
  no_log: true
  notify: service <|> Restart grafana
  when:
    - grafana_ldap_configuration | length > 0
  tags:
    - template

# Plugins are installed as grafana user, so that files belong to grafana

- name: command <|> Install grafana plugins
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - grafana
      - --
      - /usr/sbin/grafana-cli
      - --homepath
      - "{{ grafana_homepath }}"
      - --config
      - /etc/grafana/grafana.ini
      - plugins
      - install
      - "{{ item }}"
    creates: "/var/lib/grafana/plugins/{{ item }}"
  loop: "{{ grafana_plugins }}"
  notify: service <|> Restart grafana
  tags:
    - plugins

# Datasources and dashboards are provisioned using files, read by Grafana at startup

- name: file <|> Create provisioning directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: grafana
    mode: 0750
  loop:
    - /etc/grafana/provisioning
    - /etc/grafana/provisioning/datasources
    - /etc/grafana/provisioning/dashboards
    # Not created by RHEL package, Grafana logs an error at each start without it
    - /etc/grafana/provisioning/alerting
  tags:
    - template

- name: template <|> Generate /etc/grafana/provisioning/datasources/bluebanquise.yml
  ansible.builtin.template:
    src: datasources.yml.j2
    dest: /etc/grafana/provisioning/datasources/bluebanquise.yml
    owner: root
    group: grafana
    mode: 0640
  no_log: true
  notify: service <|> Restart grafana
  tags:
    - template

- name: template <|> Generate /etc/grafana/provisioning/dashboards/bluebanquise.yml
  ansible.builtin.template:
    src: dashboards.yml.j2
    dest: /etc/grafana/provisioning/dashboards/bluebanquise.yml
    owner: root
    group: grafana
    mode: 0640
  notify: service <|> Restart grafana
  tags:
    - template

- name: "file <|> Create {{ grafana_dashboards_path }} directory"
  ansible.builtin.file:
    path: "{{ grafana_dashboards_path }}"
    state: directory
    owner: grafana
    group: grafana
    mode: 0755
  tags:
    - dashboards

- name: copy <|> Install local dashboards
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ grafana_dashboards_path }}/{{ item | basename }}"
    owner: grafana
    group: grafana
    mode: 0644
  with_fileglob:
    - "{{ grafana_dashboards_dir }}/*.json"
  when:
    - grafana_dashboards_dir | length > 0
  tags:
    - dashboards

- name: uri <|> Download dashboards from grafana.com
  ansible.builtin.uri:
    url: "https://grafana.com/api/dashboards/{{ item.dashboard_id }}/revisions/{{ item.revision_id }}/download"
    return_content: true
  register: grafana_downloaded_dashboards
  loop: "{{ grafana_dashboards }}"
  check_mode: false
  tags:
    - dashboards

# Dashboards shared on grafana.com refer to their datasource using a placeholder,
# like "${DS_PROMETHEUS}", replaced here by the datasource set in grafana_dashboards.
- name: copy <|> Install dashboards downloaded from grafana.com
  ansible.builtin.copy:
    content: >-
      {{ item.content | regex_replace(grafana_datasource_placeholder, '"' ~ item.item.datasource ~ '"') }}
    dest: "{{ grafana_dashboards_path }}/grafana_com_{{ item.item.dashboard_id }}.json"
    owner: grafana
    group: grafana
    mode: 0644
  vars:
    grafana_datasource_placeholder: '"(\$\{)?DS_[A-Z0-9_-]+\}?"'
  loop: "{{ grafana_downloaded_dashboards.results }}"
  loop_control:
    label: "{{ item.item.dashboard_id }}"
  when:
    - grafana_downloaded_dashboards.results is defined
  tags:
    - dashboards

# Service

- name: service <|> Manage grafana state
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: "{{ (grafana_enable_services | default(bb_enable_services) | default(true) | bool) | ternary(true, false) }}"
    state: "{{ (grafana_start_services | default(bb_start_services) | default(true) | bool) | ternary('started', omit) }}"
  loop: "{{ grafana_services_to_start }}"
  tags:
    - service

- name: meta <|> Run handlers
  ansible.builtin.meta: flush_handlers

- name: wait_for <|> Wait for grafana to listen
  ansible.builtin.wait_for:
    host: "{{ grafana_address }}"
    port: "{{ grafana_port }}"
    timeout: 120
  when:
    - grafana_start_services | default(bb_start_services) | default(true) | bool
  tags:
    - service

# The admin password set in grafana.ini is only used when the database is created.
# It is enforced here, as grafana user so that files written by grafana-cli belong to grafana.
# runuser resets PATH, without /usr/sbin for non root users: grafana-cli full path is needed.
- name: command <|> Enforce grafana admin password
  ansible.builtin.command:
    argv:
      - runuser
      - -u
      - grafana
      - --
      - /usr/sbin/grafana-cli
      - --homepath
      - "{{ grafana_homepath }}"
      - --config
      - /etc/grafana/grafana.ini
      - admin
      - reset-admin-password
      - --password-from-stdin
    stdin: "{{ grafana_admin_password }}"
  register: grafana_password_reset
  changed_when: false
  failed_when: false
  no_log: true
  when:
    - grafana_start_services | default(bb_start_services) | default(true) | bool
  tags:
    - service

- name: fail <|> Report admin password enforcement failure
  ansible.builtin.fail:
    msg: "grafana-cli failed to set the admin password: {{ grafana_password_reset.stderr }}"
  when:
    - grafana_password_reset.rc is defined
    - grafana_password_reset.rc != 0
  tags:
    - service
