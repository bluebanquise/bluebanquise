---
grafana_address: "0.0.0.0"
grafana_port: 3000
grafana_domain: "{{ ansible_facts.fqdn | default(inventory_hostname, true) }}"

# Admin account, password is enforced at each run
grafana_admin_user: admin
grafana_admin_password: admin

# Additional grafana.ini settings, merged over the role base configuration:
# section name -> {option: value}
grafana_configuration: {}
#  smtp:
#    enabled: true
#    host: smtp.cluster.local:25
#  auth.anonymous:
#    enabled: true

# Raw content of /etc/grafana/ldap.toml. When set, [auth.ldap] is enabled.
grafana_ldap_configuration: ""

# Plugins to install (needs internet access, or a local plugins repository)
grafana_plugins: []

# Datasources, in Grafana provisioning format
grafana_datasources: []
#  - name: prometheus
#    uid: prometheus
#    type: prometheus
#    access: proxy
#    url: http://localhost:9090
#    isDefault: true

# Dashboards to download from grafana.com
grafana_dashboards: []
#  - dashboard_id: 1860
#    revision_id: 37
#    datasource: prometheus

# Folder, on the Ansible host, containing dashboards JSON files to install
grafana_dashboards_dir: ""
