---
- name: "package <|> Install nhc and additional packages"
  ansible.builtin.package:
    name: "{{ nhc_packages_to_install + nhc_custom_packages_to_install }}"
    state: present
  tags:
    - package

# Not generated when nhc.conf is provided in nhc_files
- name: template <|> Generate /etc/nhc/nhc.conf
  ansible.builtin.template:
    src: nhc.conf.j2
    dest: /etc/nhc/nhc.conf
    owner: root
    group: root
    mode: 0644
  when:
    - "'nhc.conf' not in (nhc_files | default([], true) | map(attribute='name') | list)"
  tags:
    - template

- name: file <|> Create folders of nhc custom files
  ansible.builtin.file:
    path: "/etc/nhc/{{ item.name | dirname }}"
    state: directory
    owner: root
    group: root
    mode: 0755
  loop: "{{ nhc_files | default([], true) }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.name | dirname | length > 0
  tags:
    - template

- name: template <|> Generate nhc custom files
  ansible.builtin.template:
    src: nhc_custom_file.j2
    dest: "/etc/nhc/{{ item.name }}"
    owner: root
    group: root
    mode: 0644
  loop: "{{ nhc_files | default([], true) }}"
  loop_control:
    label: "{{ item.name }}"
  tags:
    - template
