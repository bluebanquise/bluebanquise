---
http_server_packages_to_install:
  - apache2
  # apachectl, needed by community.general.apache2_module (http_server_modules, proxy modules of
  # the WebUI packs): in apache2-utils since Leap 16 (Leap 15 ships apache2ctl in apache2)
  - apache2-utils
http_server_services_to_start:
  - apache2
http_server_apache_conf_path: /etc/apache2/conf.d
http_server_apache_main_conf_path: /etc/apache2/listen.conf
http_server_configtest_command: start_apache2 -t
