---
# Handlers run in the order they are defined: the configuration is checked before Apache is
# restarted, so that an invalid configuration does not stop a running Apache.
- name: command <|> Check Apache configuration
  ansible.builtin.command: "{{ http_server_configtest_command }}"
  changed_when: false
  listen: service <|> Restart http server service
  when:
    - "'service' not in ansible_skip_tags"
    - http_server_start_services | default(bb_start_services) | default(true) | bool

- name: service <|> Restart http server service
  ansible.builtin.service:
    name: "{{ item }}"
    state: restarted
  loop: "{{ http_server_services_to_start }}"
  when:
    - "'service' not in ansible_skip_tags"
    - http_server_start_services | default(bb_start_services) | default(true) | bool
