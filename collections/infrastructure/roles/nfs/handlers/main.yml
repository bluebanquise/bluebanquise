---
# Exports changes are applied without restarting the NFS server (clients are not disturbed)
- name: command <|> Reload NFS exports
  ansible.builtin.command: exportfs -ra
  changed_when: true
  when:
    - "'service' not in ansible_skip_tags"
    - nfs_start_services | default(bb_start_services) | default(true) | bool

- name: service <|> Restart NFS server services
  ansible.builtin.service:
    name: "{{ item }}"
    state: restarted
  loop: "{{ nfs_server_services_to_start }}"
  when:
    - "'service' not in ansible_skip_tags"
    - nfs_start_services | default(bb_start_services) | default(true) | bool
