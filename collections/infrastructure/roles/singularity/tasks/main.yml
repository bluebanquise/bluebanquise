---
- name: "package <|> Install {{ singularity_packages_to_install | join(' ') }}"
  ansible.builtin.package:
    name: "{{ singularity_packages_to_install }}"
    state: present
  tags:
    - package

- name: "template <|> Generate {{ singularity_config_dir }}/singularity.conf"
  ansible.builtin.template:
    src: singularity.conf.j2
    dest: "{{ singularity_config_dir }}/singularity.conf"
    backup: true
    owner: root
    group: root
    mode: "0644"
  when: singularity_manage_conf_file | bool
  tags:
    - template

- name: "template <|> Generate {{ singularity_config_dir }}/init"
  ansible.builtin.template:
    src: init.j2
    dest: "{{ singularity_config_dir }}/init"
    backup: true
    owner: root
    group: root
    mode: "0644"
  when: singularity_manage_init_file | bool
  tags:
    - template
