---
# rdma-ndd (node description daemon) is started by udev when an RDMA device is present
- name: package <|> Install InfiniBand client packages
  ansible.builtin.package:
    name: "{{ interconnect_ofed_client_packages }}"
    state: present
  tags:
    - package

- name: pam_limits <|> Configure system memlock settings for rdma
  community.general.pam_limits:
    domain: '*'
    limit_type: "{{ item.limit_type }}"
    limit_item: memlock
    value: "{{ item.value }}"
  loop:
    - {limit_type: soft, value: "{{ interconnect_ofed_memlock_soft }}"}
    - {limit_type: hard, value: "{{ interconnect_ofed_memlock_hard }}"}
  tags:
    - pam_limits
