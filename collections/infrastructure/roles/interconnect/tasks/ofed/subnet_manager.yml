---
- name: package <|> Install opensm packages
  ansible.builtin.package:
    name: "{{ interconnect_ofed_subnet_manager_packages }}"
    state: present
  tags:
    - package

- name: assert <|> Check OpenSM priority is in range [0,15]
  ansible.builtin.assert:
    that:
      - interconnect_ofed_subnet_manager_priority | string is match('^(?:[0-9]|1[0-5])$')
    fail_msg: "interconnect_ofed_subnet_manager_priority must be in the range [0,15]."
    quiet: true

# RedHat and Suse: /usr/libexec/opensm-launch reads PRIORITY and GUIDS from /etc/sysconfig/opensm.
# Without GUIDS, OpenSM runs on the first port.

- name: lineinfile <|> Set OpenSM priority in /etc/sysconfig/opensm
  ansible.builtin.lineinfile:
    path: /etc/sysconfig/opensm
    regexp: '^#?\s*PRIORITY='
    line: "PRIORITY={{ interconnect_ofed_subnet_manager_priority }}"
    create: true
    owner: root
    group: root
    mode: 0644
  notify: service <|> Restart opensm
  when:
    - interconnect_ofed_subnet_manager_settings == 'sysconfig'
  tags:
    - template

- name: lineinfile <|> Set OpenSM ports in /etc/sysconfig/opensm
  ansible.builtin.lineinfile:
    path: /etc/sysconfig/opensm
    regexp: '^#?\s*GUIDS='
    line: "GUIDS=\"{{ interconnect_ofed_subnet_manager_guids | join(' ') }}\""
    create: true
    owner: root
    group: root
    mode: 0644
  notify: service <|> Restart opensm
  when:
    - interconnect_ofed_subnet_manager_settings == 'sysconfig'
  tags:
    - template

# Debian and Ubuntu: opensm.service starts one OpenSM per port listed in PORTS of /etc/default/opensm
# (ALL: all ports), each reading /etc/opensm/opensm.conf if it exists.

- name: lineinfile <|> Set OpenSM priority in /etc/opensm/opensm.conf
  ansible.builtin.lineinfile:
    path: /etc/opensm/opensm.conf
    regexp: '^sm_priority\s'
    line: "sm_priority {{ interconnect_ofed_subnet_manager_priority }}"
    create: true
    owner: root
    group: root
    mode: 0644
  notify: service <|> Restart opensm
  when:
    - interconnect_ofed_subnet_manager_settings == 'debian'
  tags:
    - template

- name: lineinfile <|> Set OpenSM ports in /etc/default/opensm
  ansible.builtin.lineinfile:
    path: /etc/default/opensm
    regexp: '^PORTS='
    line: "PORTS={{ ('\"' ~ (interconnect_ofed_subnet_manager_guids | join(' ')) ~ '\"') if (interconnect_ofed_subnet_manager_guids | length > 0) else 'ALL' }}"
    create: true
    owner: root
    group: root
    mode: 0644
  notify: service <|> Restart opensm
  when:
    - interconnect_ofed_subnet_manager_settings == 'debian'
  tags:
    - template

- name: service <|> Manage opensm state
  ansible.builtin.service:
    name: "{{ interconnect_ofed_subnet_manager_service }}"
    enabled: "{{ (interconnect_enable_services | default(bb_enable_services) | default(true) | bool) | ternary(true, false) }}"
    state: "{{ (interconnect_start_services | default(bb_start_services) | default(true) | bool) | ternary('started', omit) }}"
  tags:
    - service
