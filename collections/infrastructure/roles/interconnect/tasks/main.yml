---
- name: include_vars <|> Gather OS specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "vars/{{ ansible_facts.distribution | replace(' ','_') }}_{{ ansible_facts.distribution_major_version }}.yml"
        - "vars/{{ ansible_facts.os_family }}_{{ ansible_facts.distribution_major_version }}.yml"
        - "vars/{{ ansible_facts.distribution | replace(' ','_') }}.yml"
        - "vars/{{ ansible_facts.os_family }}.yml"
      skip: true
  tags:
    - always

- name: include_tasks <|> Setup OFED client
  ansible.builtin.include_tasks: ofed/client.yml
  when:
    - interconnect_stack == 'ofed'
    - interconnect_ofed_client | bool
  tags:
    - always

- name: include_tasks <|> Setup OFED subnet manager
  ansible.builtin.include_tasks: ofed/subnet_manager.yml
  when:
    - interconnect_stack == 'ofed'
    - interconnect_ofed_subnet_manager | bool
  tags:
    - always
