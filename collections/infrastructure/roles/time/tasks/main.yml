---
- name: include_vars <|> Gather OS specific variables
  # This task gathers variables defined in OS specific files.
  #
  # Search vars in:
  #  - <distribution>_<major>.yml    # eg. CentOS_8.yml
  #  - <os_family>_<major>.yml       # eg. RedHat_8.yml
  #  - <distribution>.yml            # eg. CentOS.yml
  #  - <os_family>.yml               # eg. RedHat.yml
  #
  # If no OS specific file is found, the role will default to vars/main.yml
  #
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "vars/{{ ansible_facts.distribution | replace(' ','_') }}_{{ ansible_facts.distribution_major_version }}.yml"
        - "vars/{{ ansible_facts.os_family }}_{{ ansible_facts.distribution_major_version }}.yml"
        - "vars/{{ ansible_facts.distribution | replace(' ','_') }}.yml"
        - "vars/{{ ansible_facts.os_family }}.yml"
      skip: true
  tags:
    - always

- name: firewalld <|> Configure firewall
  when:
    - os_firewall | default(true) | bool
  tags:
    - firewall
  block:
    - name: "firewalld <|> Add services to firewall's zone"
      ansible.posix.firewalld:
        zone: "{{ time_firewall_zone | default(bb_services_firewall_zone, true) | default('public') }}"
        service: "{{ item }}"
        immediate: true
        permanent: true
        state: enabled
      loop: "{{ time_firewall_services_to_add }}"
  rescue:
    - name: fail <|> Firewall configuration failed
      ansible.builtin.fail:
        msg: >-
          Firewall configuration failed: {{ (ansible_failed_result.results | default([]) | selectattr('failed', 'defined') | selectattr('failed') | map(attribute='msg') | list + [ansible_failed_result.msg | default('unknown error')]) | first }}.
          firewalld must be installed and running, with its Python bindings (python3-firewall package),
          for example using the firewall role. Set os_firewall to false to disable firewall configuration.

- name: "package <|> Install {{ time_packages_to_install | join(' ') }}"
  ansible.builtin.package:
    name: "{{ time_packages_to_install }}"
    state: present
  tags:
    - package

- name: "template <|> Generate chrony.conf"
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: "{{ time_chrony_custom_conf_path | default(time_chrony_conf_path) }}"
    owner: root
    group: root
    mode: "0644"
  notify: service <|> Restart time services
  tags:
    - template

- name: "lineinfile <|> Set chronyd options in {{ time_chronyd_options_file }}"
  ansible.builtin.lineinfile:
    path: "{{ time_chronyd_options_file }}"
    regexp: '^{{ time_chronyd_options_variable }}='
    line: '{{ time_chronyd_options_variable }}="{{ time_chronyd_options }}"'
    create: true
    owner: root
    group: root
    mode: "0644"
  notify: service <|> Restart time services
  when: time_chronyd_options is defined
  tags:
    - template

- name: "timezone <|> Set system to {{ time_time_zone | default(bb_time_zone, true) | default('Europe/Brussels', true) }} timezone"
  community.general.timezone:
    name: "{{ time_time_zone | default(bb_time_zone, true) | default('Europe/Brussels', true) }}"

- name: meta <|> Run handler tasks to restart time services
  ansible.builtin.meta: flush_handlers

- name: "service <|> Manage {{ time_services_to_start | join(' ') }} services state"
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: "{{ (time_enable_services | default(bb_enable_services) | default(true) | bool) | ternary(true, false) }}"
    state: "{{ (time_start_services | default(bb_start_services) | default(true) | bool) | ternary('started', omit) }}"
  loop: "{{ time_services_to_start }}"
  tags:
    - service
