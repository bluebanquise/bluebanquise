---
# Flat optimization: the file is the same for all hosts. It is built and rendered only once,
# on the Ansible host, using the variables of the first host of the play, then copied to all hosts.

- name: set_fact <|> Build hosts list (once for all hosts)
  ansible.builtin.set_fact:
    hosts_file_hosts: "{{ hostvars | bluebanquise.infrastructure.hosts_by_first_octets(groups[hosts_file_group], networks) }}"
  vars:
    hosts_file_group: "{{ hosts_file_restrict_to_group | default(bb_restrict_to_group, true) | default('all', true) }}"
  run_once: true
  tags:
    - template

- name: tempfile <|> Create local working directory
  ansible.builtin.tempfile:
    state: directory
    suffix: hosts_file
  register: hosts_file_work_dir
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: false
  check_mode: false
  tags:
    - template

- name: template <|> Render hosts file locally (once for all hosts)
  ansible.builtin.template:
    src: hosts.j2
    dest: "{{ hosts_file_work_dir.path }}/hosts"
    mode: 0644
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: false
  check_mode: false
  tags:
    - template

- name: copy <|> Push /etc/hosts
  ansible.builtin.copy:
    src: "{{ hosts_file_work_dir.path }}/hosts"
    dest: /etc/hosts
    owner: root
    group: root
    mode: 0644
  tags:
    - template

- name: file <|> Remove local working directory
  ansible.builtin.file:
    path: "{{ hosts_file_work_dir.path }}"
    state: absent
  delegate_to: localhost
  run_once: true
  become: false
  changed_when: false
  check_mode: false
  tags:
    - template
