---

- name: include_vars <|> Gather OS specific variables
  # This task gathers variables defined in OS specific files.
  #
  # Search vars in:
  #  - <distribution>_<major>.yml    # eg. CentOS_8.yml
  #  - <os_family>_<major>.yml       # eg. RedHat_8.yml
  #  - <distribution>.yml            # eg. CentOS.yml
  #  - <os_family>.yml               # eg. RedHat.yml
  #
  # If no OS specific file is found, the role will default to vars/main.yml
  #
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "vars/{{ ansible_facts.distribution | replace(' ','_') }}_{{ ansible_facts.distribution_major_version }}.yml"
        - "vars/{{ ansible_facts.os_family }}_{{ ansible_facts.distribution_major_version }}.yml"
        - "vars/{{ ansible_facts.distribution | replace(' ','_') }}.yml"
        - "vars/{{ ansible_facts.os_family }}.yml"
      skip: true
  tags:
    - always

- name: "package <|> Install {{ auditd_packages_to_install | join(' ') }}"
  ansible.builtin.package:
    name: "{{ auditd_packages_to_install }}"
    state: present
  tags:
    - package

- name: "stat <|> Check that the {{ auditd_plugins_directory }}/{{ auditd_syslog_file }} exists"
  ansible.builtin.stat:
    path: "{{ auditd_plugins_directory }}/{{ auditd_syslog_file }}"
  register: auditd_result

- name: "replace <|> Enable audit logs forwarding to syslog"
  ansible.builtin.replace:
    path: "{{ auditd_plugins_directory }}/{{ auditd_syslog_file }}"
    regexp: "^active = .*"
    replace: "active = yes"
  notify: service <|> Restart auditd service
  when:
    - auditd_result.stat.exists
    - auditd_forward_audit_logs | bool

- name: "replace <|> Disable audit logs forwarding to syslog"
  ansible.builtin.replace:
    path: "{{ auditd_plugins_directory }}/{{ auditd_syslog_file }}"
    regexp: "^active = .*"
    replace: "active = no"
  notify: service <|> Restart auditd service
  when:
    - auditd_result.stat.exists
    - not (auditd_forward_audit_logs | bool)

- name: "lineinfile <|> Enable root command logging for {{ item }}"
  ansible.builtin.lineinfile:
    path: "{{ auditd_config_rules_file }}"
    line: "-a exit,always -F arch={{ item }} -F euid=0 -S execve"
    state: present
  loop: "{{ auditd_config_rules_architectures }}"
  notify: service <|> Restart auditd service
  when: auditd_config_root_log | bool

- name: "lineinfile <|> Disable root command logging for {{ item }}"
  ansible.builtin.lineinfile:
    path: "{{ auditd_config_rules_file }}"
    line: "-a exit,always -F arch={{ item }} -F euid=0 -S execve"
    state: absent
  loop: "{{ auditd_config_rules_architectures }}"
  notify: service <|> Restart auditd service
  when: not (auditd_config_root_log | bool)

- name: "service <|> Manage {{ auditd_services_to_start | join(' ') }} state"
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: "{{ (auditd_enable_services | default(bb_enable_services) | default(true) | bool) | ternary(true, false) }}"
    state: "{{ (auditd_start_services | default(bb_start_services) | default(true) | bool) | ternary('started', omit) }}"
  loop: "{{ auditd_services_to_start }}"
  tags:
    - service
