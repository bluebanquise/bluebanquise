---
# wicked was replaced by NetworkManager in openSUSE Leap 16, and only exists on older versions
- name: service_facts <|> Gather services
  ansible.builtin.service_facts:

- name: "service <|> Disable wicked"
  ansible.builtin.service:
    name: wicked
    enabled: false
    state: stopped
  notify: reboot <|> Reboot system
  when:
    - (ansible_facts.services['wicked.service'] | default({})).status | default('not-found') != 'not-found'
