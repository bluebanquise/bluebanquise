---
- name: include_vars <|> Gather OS specific variables
  # This task gathers variables defined in OS specific files.
  #
  # Search vars in:
  #  - <distribution>_<major>.yml    # eg. CentOS_8.yml
  #  - <os_family>_<major>.yml       # eg. RedHat_8.yml
  #  - <distribution>.yml            # eg. CentOS.yml
  #  - <os_family>.yml               # eg. RedHat.yml
  #
  # If no OS specific file is found, the role will default to vars/main.yml
  #
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "vars/{{ ansible_facts.distribution | replace(' ','_') }}_{{ ansible_facts.distribution_major_version }}.yml"
        - "vars/{{ ansible_facts.os_family }}_{{ ansible_facts.distribution_major_version }}.yml"
        - "vars/{{ ansible_facts.distribution | replace(' ','_') }}.yml"
        - "vars/{{ ansible_facts.os_family }}.yml"
      skip: true
  tags:
    - always

- name: "package <|> Install {{ nic_packages_to_install | join(' ') }}"
  ansible.builtin.package:
    name: "{{ nic_packages_to_install }}"
    state: present
  tags:
    - package
  notify: service <|> Restart nic services

- name: ini_file <|> Configure NetworkManager to enforce configuration
  community.general.ini_file:
    path: '/etc/NetworkManager/NetworkManager.conf'
    section: 'device'
    option: 'keep-configuration'
    value: 'no'
    no_extra_spaces: true
    owner: 'root'
    group: 'root'
    mode: '0644'
  when: nic_enforce_configuration | bool

- name: "service <|> Manage {{ nic_services_to_start | join(' ') }} state"
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: "{{ (nic_enable_services | default(bb_enable_services) | default(true) | bool) | ternary(true, false) }}"
    state: "{{ (nic_start_services | default(bb_start_services) | default(true) | bool) | ternary('started', omit) }}"
  loop: "{{ nic_services_to_start }}"
  tags:
    - service

- name: meta <|> Run handler tasks
  ansible.builtin.meta: flush_handlers

- name: include_tasks <|> Configure network interfaces via nmcli
  ansible.builtin.include_tasks: nmcli.yml
  tags:
    - always

- name: include_tasks <|> Use OS dedicated task
  ansible.builtin.include_tasks: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_facts.os_family | replace(' ','_') }}/main.yml"
      skip: true
  tags:
    - always

- name: meta <|> Run handler tasks to apply OS dedicated events
  ansible.builtin.meta: flush_handlers
