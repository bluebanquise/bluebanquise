---
# Reload: haproxy starts new processes with the new configuration, without dropping connections
- name: service <|> Reload haproxy
  ansible.builtin.service:
    name: "{{ item }}"
    state: reloaded
  loop: "{{ haproxy_services_to_start }}"
  when:
    - "'service' not in ansible_skip_tags"
    - haproxy_start_services | default(bb_start_services) | default(true) | bool
