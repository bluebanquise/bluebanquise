---
- name: "package <|> Install {{ haproxy_packages_to_install | join(' ') }}"
  ansible.builtin.package:
    name: "{{ haproxy_packages_to_install }}"
    state: present
  tags:
    - package

# Ports to open: bind port of every resource listening (all types except backend)
- name: set_fact <|> Initialize firewall ports list
  ansible.builtin.set_fact:
    haproxy_firewall_ports: []
  tags:
    - firewall

- name: set_fact <|> Gather resources bind ports
  ansible.builtin.set_fact:
    haproxy_firewall_ports: "{{ haproxy_firewall_ports + [item.bind.port | string + '/tcp'] }}"
  loop: "{{ haproxy_resources }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - item.bind is defined
  tags:
    - firewall

- name: firewalld <|> Configure firewall
  when:
    - os_firewall | default(true) | bool
  tags:
    - firewall
  block:
    - name: "firewalld <|> Add haproxy ports to firewall's zone"
      ansible.posix.firewalld:
        zone: "{{ haproxy_firewall_zone | default(bb_services_firewall_zone, true) | default('public') }}"
        port: "{{ item }}"
        immediate: true
        permanent: true
        state: enabled
      loop: "{{ haproxy_firewall_ports | unique }}"
  rescue:
    - name: fail <|> Firewall configuration failed
      ansible.builtin.fail:
        msg: >-
          Firewall configuration failed: {{ (ansible_failed_result.results | default([]) | selectattr('failed', 'defined') | selectattr('failed') | map(attribute='msg') | list + [ansible_failed_result.msg | default('unknown error')]) | first }}.
          firewalld must be installed and running, with its Python bindings (python3-firewall package),
          for example using the firewall role. Set os_firewall to false to disable firewall configuration.

- name: sysctl <|> Enable bind on non local ip
  ansible.posix.sysctl:
    name: net.ipv4.ip_nonlocal_bind
    value: '1'
    state: present
    reload: true
  when:
    - haproxy_enable_ip_nonlocal_bind | bool

# Chroot folder, also holding the stats socket in role default global settings.
# Not shipped by all distributions (openSUSE Leap 16).
- name: file <|> Create /var/lib/haproxy directory
  ansible.builtin.file:
    path: /var/lib/haproxy
    state: directory
    owner: root
    group: root
    mode: 0755

- name: template <|> Generate /etc/haproxy/haproxy.cfg
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: 0644
    validate: haproxy -c -f %s
  notify: service <|> Reload haproxy
  tags:
    - template

- name: service <|> Manage haproxy state
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: "{{ (haproxy_enable_services | default(bb_enable_services) | default(true) | bool) | ternary(true, false) }}"
    state: "{{ (haproxy_start_services | default(bb_start_services) | default(true) | bool) | ternary('started', omit) }}"
  loop: "{{ haproxy_services_to_start }}"
  tags:
    - service
