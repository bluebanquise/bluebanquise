---
# The http server only reads host iPXE files now (legacy bootswitch.cgi used to write them), so
# drop the read-write SELinux context previous versions set, back to default httpd_sys_content_t.
- name: sefcontext <|> Remove legacy read-write SELinux context on /var/www/html/pxe/nodes
  community.general.sefcontext:
    target: '/var/www/html/pxe/nodes(/.*)?'
    setype: httpd_sys_rw_content_t
    state: absent
  register: pxe_stack_nodes_sefcontext
  when:
    - ansible_facts.selinux.status == "enabled"

- name: command <|> Restore SELinux context on /var/www/html/pxe/nodes
  ansible.builtin.command:
    argv:
      - restorecon
      - -R
      - /var/www/html/pxe/nodes
  when:
    - ansible_facts.selinux.status == "enabled"
    - pxe_stack_nodes_sefcontext is changed

# tftp-server (tftp.service/tftp.socket) is socket-activated and has no env file:
# options and directory are applied via a systemd drop-in overriding ExecStart.
# pxe_stack_tftp_address is intentionally not applied here (would require
# touching tftp.socket's ListenDatagram).
- name: file <|> Create tftp.service systemd drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/tftp.service.d
    state: directory
    mode: 0755
  when: (ansible_facts.distribution_major_version | int) >= 9

- name: template <|> Configure tftp-server via tftp.service systemd drop-in
  ansible.builtin.template:
    src: tftp_service_override.conf.j2
    dest: /etc/systemd/system/tftp.service.d/override.conf
    mode: 0644
  when: (ansible_facts.distribution_major_version | int) >= 9
  notify:
    - systemd <|> Reload systemd configuration
    - service <|> Restart pxe services
