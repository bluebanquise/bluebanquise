- name: template <|> Create autoyast file for OpenSuSE 15 / SLES 15
  ansible.builtin.template:
    src: Suse/autoyast.xml.j2
    dest: "{{ pxe_stack_htdocs_path }}/pxe/equipment_profiles/{{ item | trim }}.autoyast.xml"
    mode: 0644
    owner: "{{ pxe_stack_apache_user }}"
    group: "{{ pxe_stack_apache_group }}"
    # validate: /usr/bin/xmllint --noout --relaxng /usr/share/YaST2/schema/autoyast/rng/profile.rng %s
  vars:
    equipment: "{{ pxe_stack_equipment_profiles[item] | default({}, true) }}"
  loop: "{{ pxe_stack_equipment_profiles | default({}, true) | flatten(levels=1) }}"
  when:
    - (pxe_stack_equipment_profiles[item]['hw']['hw_equipment_type'] | default(pxe_stack_hw_equipment_type)) == "server"
    - (pxe_stack_equipment_profiles[item]['os']['os_operating_system']['distribution'] | default(pxe_stack_os_operating_system.distribution) | lower) in ['opensuse','sles']
    - (pxe_stack_equipment_profiles[item]['os']['os_operating_system']['distribution_major_version'] | default(pxe_stack_os_operating_system.distribution_major_version) | int) in [15]
  tags:
    - template

# OpenSuSE 16 uses the Agama installer, with a JSON profile instead of AutoYaST XML
- name: assert <|> Check OpenSuSE 16 partitioning and custom content format
  ansible.builtin.assert:
    that:
      - partitioning is not string
      - custom_content is not string
    fail_msg: >-
      Equipment profile {{ item }}: on OpenSuSE 16, os_partitioning must be an Agama storage section and
      os_autoinstall_custom_content an Agama profile part (YAML dictionaries), not AutoYaST XML. See pxe_stack README.
    quiet: true
  vars:
    equipment: "{{ pxe_stack_equipment_profiles[item] | default({}, true) }}"
    partitioning: "{{ equipment['os']['os_partitioning'] | default(equipment['hw']['hw_partitioning'], true) | default(pxe_stack_os_partitioning, true) | default({}, true) }}"
    custom_content: "{{ equipment['os']['os_autoinstall_custom_content'] | default(pxe_stack_os_autoinstall_custom_content, true) | default({}, true) }}"
  loop: "{{ pxe_stack_equipment_profiles | default({}, true) | flatten(levels=1) }}"
  when:
    - (pxe_stack_equipment_profiles[item]['hw']['hw_equipment_type'] | default(pxe_stack_hw_equipment_type)) == "server"
    - (pxe_stack_equipment_profiles[item]['os']['os_operating_system']['distribution'] | default(pxe_stack_os_operating_system.distribution) | lower) in ['opensuse']
    - (pxe_stack_equipment_profiles[item]['os']['os_operating_system']['distribution_major_version'] | default(pxe_stack_os_operating_system.distribution_major_version) | int) in [16]

- name: template <|> Create Agama profile for OpenSuSE 16
  ansible.builtin.template:
    src: Suse/agama.json.j2
    dest: "{{ pxe_stack_htdocs_path }}/pxe/equipment_profiles/{{ item | trim }}.agama.json"
    mode: "0644"
    owner: "{{ pxe_stack_apache_user }}"
    group: "{{ pxe_stack_apache_group }}"
  vars:
    equipment: "{{ pxe_stack_equipment_profiles[item] | default({}, true) }}"
  loop: "{{ pxe_stack_equipment_profiles | default({}, true) | flatten(levels=1) }}"
  when:
    - (pxe_stack_equipment_profiles[item]['hw']['hw_equipment_type'] | default(pxe_stack_hw_equipment_type)) == "server"
    - (pxe_stack_equipment_profiles[item]['os']['os_operating_system']['distribution'] | default(pxe_stack_os_operating_system.distribution) | lower) in ['opensuse']
    - (pxe_stack_equipment_profiles[item]['os']['os_operating_system']['distribution_major_version'] | default(pxe_stack_os_operating_system.distribution_major_version) | int) in [16]
  tags:
    - template

- name: template <|> equipment_profiles for OpenSuSE / SLES
  ansible.builtin.template:
    src: Suse/equipment_profile_autoyast.ipxe.j2
    dest: "{{ pxe_stack_htdocs_path }}/pxe/equipment_profiles/{{ item | trim }}.ipxe"
    mode: 0644
    owner: "{{ pxe_stack_apache_user }}"
    group: "{{ pxe_stack_apache_group }}"
  vars:
    equipment: "{{ pxe_stack_equipment_profiles[item] | default({}, true) }}"
  loop: "{{ pxe_stack_equipment_profiles | default({}, true) | flatten(levels=1) }}"
  when:
    - (pxe_stack_equipment_profiles[item]['hw']['hw_equipment_type'] | default(pxe_stack_hw_equipment_type)) == "server"
    - (pxe_stack_equipment_profiles[item]['os']['os_operating_system']['distribution'] | default(pxe_stack_os_operating_system.distribution) | lower) in ['opensuse','sles']
  tags:
    - template
