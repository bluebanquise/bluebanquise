---
- name: include_vars <|> Gather OS specific variables
  # This task gathers variables defined in OS specific files.
  #
  # Search vars in:
  #  - <distribution>_<major>.yml    # eg. CentOS_8.yml
  #  - <os_family>_<major>.yml       # eg. RedHat_8.yml
  #  - <distribution>.yml            # eg. CentOS.yml
  #  - <os_family>.yml               # eg. RedHat.yml
  #
  # If no OS specific file is found, the role will default to vars/main.yml
  #
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "vars/{{ ansible_facts.distribution | replace(' ','_') }}_{{ ansible_facts.distribution_version }}.yml"
        - "vars/{{ ansible_facts.distribution | replace(' ','_') }}_{{ ansible_facts.distribution_major_version }}.yml"
        - "vars/{{ ansible_facts.os_family }}_{{ ansible_facts.distribution_version }}.yml"
        - "vars/{{ ansible_facts.os_family }}_{{ ansible_facts.distribution_major_version }}.yml"
        - "vars/{{ ansible_facts.distribution | replace(' ','_') }}.yml"
        - "vars/{{ ansible_facts.os_family }}.yml"
      skip: true
  tags:
    - always

- name: "firewalld <|> Add services to firewall's zone"
  ansible.posix.firewalld:
    zone: "{{ pxe_stack_firewall_zone | default(bb_services_firewall_zone, true) | default('public') }}"
    service: "{{ item }}"
    immediate: true
    permanent: true
    state: enabled
  when:
    - os_firewall | default(true) | bool
  loop: "{{ pxe_stack_firewall_services_to_add }}"
  tags:
    - firewall

- name: "firewalld <|> Add pxe stack daemon port {{ pxe_stack_daemon_port }}/tcp to firewall"
  ansible.posix.firewalld:
    zone: "{{ pxe_stack_firewall_zone | default(bb_services_firewall_zone, true) | default('public') }}"
    port: "{{ pxe_stack_daemon_port }}/tcp"
    immediate: true
    permanent: true
    state: enabled
  when:
    - os_firewall | default(true) | bool
  tags:
    - firewall

# This calculation takes time, so we store it in memory for later usage
- name: fact <|> Calculate equipment profiles
  ansible.builtin.set_fact:
    pxe_stack_equipment_profiles: "{{ hostvars | bluebanquise.infrastructure.equipment_profiles(groups[(pxe_stack_retrict_to_group | default(bb_retrict_to_group, true) | default('all', true))], groups) }}"
  run_once: true
  tags:
    - templates

- name: "package <|> Install {{ (pxe_stack_packages_to_install + [pxe_stack_tftp_package | default(pxe_stack_default_tftp_package)]) | join(' ') }} packages"
  ansible.builtin.package:
    name: "{{ pxe_stack_packages_to_install + [pxe_stack_tftp_package | default(pxe_stack_default_tftp_package)] }}"
    state: present
  tags:
    - package
  notify: systemd <|> Reload systemd configuration

- name: file <|> Create pxe directories structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: 0755
  loop:
    - /etc/bluebanquise
    - /etc/bluebanquise/bootset

- name: "group <|> Create {{ pxe_stack_daemon_user }} group"
  ansible.builtin.group:
    name: "{{ pxe_stack_daemon_user }}"
    system: true

- name: "user <|> Create {{ pxe_stack_daemon_user }} user"
  # Dedicated unprivileged user running bluebanquise-pxe-stack-daemon. Not a sudoer, no login.
  ansible.builtin.user:
    name: "{{ pxe_stack_daemon_user }}"
    group: "{{ pxe_stack_daemon_user }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: file <|> Create pxe http directories structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: 0755
    owner: "{{ pxe_stack_apache_user }}"
    group: "{{ pxe_stack_apache_group }}"
  loop:
    - "{{ pxe_stack_htdocs_path }}/pxe/"
    - "{{ pxe_stack_htdocs_path }}/pxe/bin"
    - "{{ pxe_stack_htdocs_path }}/pxe/equipment_profiles"
    - "{{ pxe_stack_htdocs_path }}/pxe/osdeploy"
    - "{{ pxe_stack_htdocs_path }}/pxe/tools"
    - "{{ pxe_stack_htdocs_path }}/pxe/netboots"

# Host iPXE files folder is owned by the daemon's user, so the daemon and bluebanquise-bootset
# (which drops its privileges to that user) can write into it. The http server only reads these
# files (0644), and new files inherit the folder's SELinux label since they are always created
# inside it (atomic writes use a temporary file in the same folder).
- name: "file <|> Create {{ pxe_stack_htdocs_path }}/pxe/nodes directory"
  ansible.builtin.file:
    path: "{{ pxe_stack_htdocs_path }}/pxe/nodes"
    state: directory
    mode: 0755
    owner: "{{ pxe_stack_daemon_user }}"
    group: "{{ pxe_stack_apache_group }}"

- name: "copy <|> Create {{ pxe_stack_htdocs_path }}/pxe/nodes/.lock file"
  # Shared flock between the daemon and bluebanquise-bootset
  ansible.builtin.copy:
    content: ""
    dest: "{{ pxe_stack_htdocs_path }}/pxe/nodes/.lock"
    mode: 0644
    owner: "{{ pxe_stack_daemon_user }}"
    group: "{{ pxe_stack_daemon_user }}"
    force: false

- name: include_tasks <|> Use OS dedicated task
  ansible.builtin.include_tasks: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_facts.distribution | replace(' ','_') }}_{{ ansible_facts.distribution_version }}/main.yml"
        - "{{ ansible_facts.distribution | replace(' ','_') }}_{{ ansible_facts.distribution_major_version }}/main.yml"
        - "{{ ansible_facts.os_family | replace(' ','_') }}_{{ ansible_facts.distribution_version }}/main.yml"
        - "{{ ansible_facts.os_family | replace(' ','_') }}_{{ ansible_facts.distribution_major_version }}/main.yml"
        - "{{ ansible_facts.distribution | replace(' ','_') }}/main.yml"
        - "{{ ansible_facts.os_family | replace(' ','_') }}/main.yml"
      skip: true
  tags:
    - internal

- name: template <|> Generate /etc/bluebanquise/bootset/nodes_parameters.yml
  ansible.builtin.template:
    src: nodes_parameters.yml.j2
    dest: /etc/bluebanquise/bootset/nodes_parameters.yml
    mode: 0644
  notify: service <|> Restart pxe services
  tags:
    - template

- name: template <|> Generate /etc/bluebanquise/bootset/pxe_parameters.yml
  ansible.builtin.template:
    src: "pxe_parameters.yml.j2"
    dest: "/etc/bluebanquise/bootset/pxe_parameters.yml"
    mode: 0644

- name: "template <|> Generate {{ pxe_stack_htdocs_path }}/pxe/ files"
  ansible.builtin.template:
    src: "{{ item }}.ipxe.j2"
    dest: "{{ pxe_stack_htdocs_path }}/pxe/{{ item }}.ipxe"
    mode: 0755
    owner: "{{ pxe_stack_apache_user }}"
    group: "{{ pxe_stack_apache_group }}"
  loop:
    - convergence
    - menu
  tags:
    - template

- name: "template <|> Generate {{ pxe_stack_htdocs_path }}/pxe/nodes/.ipxe"
  ansible.builtin.template:
    src: nohostname.ipxe.j2
    dest: "{{ pxe_stack_htdocs_path }}/pxe/nodes/.ipxe"
    mode: 0755
    owner: "{{ pxe_stack_apache_user }}"
    group: "{{ pxe_stack_apache_group }}"
  tags:
    - template

# Legacy bootswitch.cgi was an unauthenticated CGI editing host boot files as the http server
# user. Removed, ensure upgraded systems do not keep it.
- name: file <|> Remove legacy bootswitch.cgi and cgi.conf
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ pxe_stack_apache_cgi_bin_path }}/bootswitch.cgi"
    - "{{ pxe_stack_apache_conf_path }}/cgi.conf"
  notify: service <|> Restart pxe services

- name: "copy <|> Copy bluebanquise-bootset"
  ansible.builtin.copy:
    src: bluebanquise-bootset
    dest: "/usr/bin/bluebanquise-bootset"
    owner: root
    group: root
    mode: 0755

- name: "copy <|> Copy bluebanquise-netboots-installer"
  ansible.builtin.copy:
    src: bluebanquise-netboots-installer
    dest: "/usr/bin/bluebanquise-netboots-installer"
    owner: root
    group: root
    mode: 0755

- name: "copy <|> Copy netboots_installer.yml (skip if already present)"
  ansible.builtin.copy:
    src: netboots_installer.yml
    dest: "/etc/bluebanquise/bootset/netboots_installer.yml"
    owner: root
    group: root
    mode: 0644
    force: false


################################################################################################
######################## DISKFUL

- name: include_tasks <|> Include diskful
  ansible.builtin.include_tasks: diskful.yml
  tags:
    - internal


################################################################################################
######################## DISKLESS

- name: include_tasks <|> Include diskless
  ansible.builtin.include_tasks: diskless.yml
  when: pxe_stack_enable_diskless
  tags:
    - internal


################################################################################################
######################## TOOLS

- name: include_tasks <|> Include tools
  ansible.builtin.include_tasks: tools.yml
  tags:
    - internal


################################################################################################
######################## PXE STACK DAEMON

- name: pxe_stack_daemon <|> Install daemon script
  ansible.builtin.copy:
    src: bluebanquise-pxe-stack-daemon
    dest: "{{ pxe_stack_daemon_script_path }}"
    owner: root
    group: root
    mode: '0755'

- name: pxe_stack_daemon <|> Generate daemon configuration file
  ansible.builtin.template:
    src: pxe_stack_daemon.conf.j2
    dest: "{{ pxe_stack_daemon_conf_path }}"
    owner: root
    group: "{{ pxe_stack_daemon_user }}"
    mode: '0640'

# Creates missing host iPXE files and refreshes inventory-derived values of existing ones, so
# files exist even if the daemon service is not started. Started as root, the script drops its
# privileges to pxe_stack_daemon_user itself before touching any file.
- name: pxe_stack_daemon <|> Bootstrap host iPXE files
  ansible.builtin.command:
    argv:
      - "{{ pxe_stack_daemon_script_path }}"
      - "{{ pxe_stack_daemon_conf_path }}"
      - --bootstrap-only
  register: pxe_stack_daemon_bootstrap
  changed_when: "' 0 created, 0 updated,' not in pxe_stack_daemon_bootstrap.stdout"
  tags:
    - template

- name: pxe_stack_daemon <|> Install systemd service
  ansible.builtin.template:
    src: bluebanquise-pxe-stack-daemon.service.j2
    dest: /etc/systemd/system/bluebanquise-pxe-stack-daemon.service
    owner: root
    group: root
    mode: '0644'
  notify: service <|> Restart pxe services

- name: pxe_stack_daemon <|> Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true
  tags:
    - service


################################################################################################
######################## HANDLERS AND SERVICES

- name: meta <|> Run handler tasks to restart pxe services
  ansible.builtin.meta: flush_handlers

- name: "service <|> Manage all {{ (pxe_stack_services_to_start + [pxe_stack_tftp_service | default(pxe_stack_default_tftp_service)]) | join(' ') }} state"
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: "{{ (pxe_stack_enable_services | default(bb_enable_services) | default(true) | bool) | ternary(true, false) }}"
    state: "{{ (pxe_stack_start_services | default(bb_start_services) | default(true) | bool) | ternary('started', omit) }}"
  loop: "{{ pxe_stack_services_to_start + [pxe_stack_tftp_service | default(pxe_stack_default_tftp_service)] }}"
  tags:
    - service
