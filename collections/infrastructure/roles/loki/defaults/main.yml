---
# Loki listening address and ports
loki_ip: 127.0.0.1
loki_port: 3100
loki_grpc_port: 9095

loki_data_dir: /var/lib/loki

# Logs older than this are deleted, 0s: keep forever
loki_retention_period: 0s

# Syslog listener of Alloy, receiving logs forwarded by rsyslog
loki_syslog_ip: 127.0.0.1
loki_syslog_port: 1514
