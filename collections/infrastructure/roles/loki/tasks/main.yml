---
- name: assert <|> Check for variables of previous role versions
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.varnames', loki_legacy_variables_regex) | length == 0
    fail_msg: >-
      Variables {{ lookup('ansible.builtin.varnames', loki_legacy_variables_regex) }} belong to the
      Promtail based loki role (< 2.0.0) and are not used anymore. See the role README.
    quiet: true
  tags:
    - always

- name: firewalld <|> Configure firewall
  when:
    - os_firewall | default(true) | bool
  tags:
    - firewall
  block:
    - name: "firewalld <|> Add loki port to firewall's zone"
      ansible.posix.firewalld:
        zone: "{{ loki_firewall_zone | default(bb_services_firewall_zone, true) | default('public') }}"
        port: "{{ loki_port }}/tcp"
        immediate: true
        permanent: true
        state: enabled
      when:
        - loki_ip is not match('127\\.')
        - loki_ip != 'localhost'
  rescue:
    - name: fail <|> Firewall configuration failed
      ansible.builtin.fail:
        msg: >-
          Firewall configuration failed: {{ (ansible_failed_result.results | default([]) | selectattr('failed', 'defined') | selectattr('failed') | map(attribute='msg') | list + [ansible_failed_result.msg | default('unknown error')]) | first }}.
          firewalld must be installed and running, with its Python bindings (python3-firewall package),
          for example using the firewall role. Set os_firewall to false to disable firewall configuration.

# Promtail reached end of life, previous role versions used it to receive rsyslog traffic.
- name: stat <|> Check for Promtail installed by previous role versions
  ansible.builtin.stat:
    path: /etc/systemd/system/promtail.service
  register: loki_promtail_unit

- name: service <|> Stop and disable promtail
  ansible.builtin.service:
    name: promtail
    state: stopped
    enabled: false
  when:
    - loki_promtail_unit.stat.exists
  tags:
    - service

- name: file <|> Remove Promtail files of previous role versions
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/promtail.service
    - /etc/rsyslog.d/promtail-forward.conf
    - /etc/loki/loki.yml
  notify:
    - systemd <|> Reload systemd configuration
    - service <|> Restart rsyslog

- name: "package <|> Install {{ loki_packages_to_install | join(' ') }}"
  ansible.builtin.package:
    name: "{{ loki_packages_to_install }}"
    state: present
  tags:
    - package

# Previous role versions replaced the packaged loki.service with their own one, at the same path.
- name: file <|> Create loki.service.d directory
  ansible.builtin.file:
    path: /etc/systemd/system/loki.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: template <|> Generate loki.service override
  ansible.builtin.template:
    src: loki-override.conf.j2
    dest: /etc/systemd/system/loki.service.d/bluebanquise.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - systemd <|> Reload systemd configuration
    - service <|> Restart loki

- name: "file <|> Create {{ loki_data_dir }}"
  ansible.builtin.file:
    path: "{{ loki_data_dir }}"
    state: directory
    owner: loki
    mode: "0700"

- name: template <|> Generate /etc/loki/config.yml
  ansible.builtin.template:
    src: config.yml.j2
    dest: /etc/loki/config.yml
    owner: root
    group: root
    mode: "0644"
    validate: /usr/bin/loki -verify-config -config.file=%s
  notify: service <|> Restart loki
  tags:
    - template

- name: template <|> Generate /etc/alloy/config.alloy
  ansible.builtin.template:
    src: config.alloy.j2
    dest: /etc/alloy/config.alloy
    owner: root
    group: alloy
    mode: "0640"
    validate: /usr/bin/alloy fmt %s
  notify: service <|> Reload alloy
  tags:
    - template

- name: template <|> Generate /etc/rsyslog.d/loki.conf
  ansible.builtin.template:
    src: rsyslog-loki.conf.j2
    dest: /etc/rsyslog.d/loki.conf
    owner: root
    group: root
    mode: "0644"
  notify: service <|> Restart rsyslog
  tags:
    - template

- name: meta <|> Run handlers
  ansible.builtin.meta: flush_handlers

- name: "service <|> Manage {{ loki_services_to_start | join(' ') }} state"
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: "{{ (loki_enable_services | default(bb_enable_services) | default(true) | bool) | ternary(true, false) }}"
    state: "{{ (loki_start_services | default(bb_start_services) | default(true) | bool) | ternary('started', omit) }}"
  loop: "{{ loki_services_to_start }}"
  tags:
    - service
