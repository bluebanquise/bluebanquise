---
- name: systemd <|> Reload systemd configuration
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - "'service' not in ansible_skip_tags"

- name: service <|> Restart loki
  ansible.builtin.service:
    name: loki
    state: restarted
  when:
    - "'service' not in ansible_skip_tags"
    - loki_start_services | default(bb_start_services) | default(true) | bool

- name: service <|> Reload alloy
  ansible.builtin.service:
    name: alloy
    state: reloaded
  when:
    - "'service' not in ansible_skip_tags"
    - loki_start_services | default(bb_start_services) | default(true) | bool

- name: service <|> Restart rsyslog
  ansible.builtin.service:
    name: rsyslog
    state: restarted
  when:
    - "'service' not in ansible_skip_tags"
    - loki_start_services | default(bb_start_services) | default(true) | bool
