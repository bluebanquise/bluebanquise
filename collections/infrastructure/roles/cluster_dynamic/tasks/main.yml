---

- name: cluster_dynamic <|> Ensure /etc/bluebanquise directory exists
  ansible.builtin.file:
    path: /etc/bluebanquise
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: cluster_dynamic <|> Install daemon script
  ansible.builtin.copy:
    src: bluebanquise-cluster-dynamic
    dest: "{{ cluster_dynamic_script_path }}"
    owner: root
    group: root
    mode: '0755'

- name: cluster_dynamic <|> Generate configuration file
  ansible.builtin.template:
    src: cluster_dynamic.conf.j2
    dest: "{{ cluster_dynamic_conf_path }}"
    owner: bluebanquise
    group: bluebanquise
    mode: '0640'

- name: cluster_dynamic <|> Install systemd service
  ansible.builtin.template:
    src: bluebanquise-cluster-dynamic.service.j2
    dest: /etc/systemd/system/bluebanquise-cluster-dynamic.service
    owner: root
    group: root
    mode: '0644'

- name: cluster_dynamic <|> Reload systemd daemon
  ansible.builtin.systemd:
    daemon_reload: true

- name: "service <|> Manage bluebanquise-cluster-dynamic state"
  ansible.builtin.service:
    name: "bluebanquise-cluster-dynamic"
    enabled: "{{ (cluster_dynamic_enable_services | default(bb_enable_services) | default(true) | bool) | ternary(true, false) }}"
    state: "{{ (cluster_dynamic_start_services | default(bb_start_services) | default(true) | bool) | ternary('started', omit) }}"
  tags:
    - service
