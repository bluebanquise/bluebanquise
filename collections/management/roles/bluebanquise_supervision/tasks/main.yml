---
- name: include_vars <|> Gather OS specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "vars/{{ ansible_facts.os_family }}.yml"
  tags:
    - always

- name: "package <|> Install packages"
  ansible.builtin.package:
    name: "{{ bluebanquise_supervision_packages_to_install }}"
    state: present
  tags:
    - package


################################################################################################
######################## USER

# Group of all WebUI packs daemons users: it can read the WebUI users file
- name: "group <|> Create bluebanquise-webui group"
  ansible.builtin.group:
    name: bluebanquise-webui
    system: true

- name: "group <|> Create {{ bluebanquise_supervision_user }} group"
  ansible.builtin.group:
    name: "{{ bluebanquise_supervision_user }}"
    system: true

# Dedicated unprivileged user running all the daemons, no login. It is only a sudoer for the
# commands listed in bluebanquise_supervision_sudoers_commands.
- name: "user <|> Create {{ bluebanquise_supervision_user }} user"
  ansible.builtin.user:
    name: "{{ bluebanquise_supervision_user }}"
    group: "{{ bluebanquise_supervision_user }}"
    groups:
      - bluebanquise-webui
    append: true
    system: true
    shell: /usr/sbin/nologin
    home: "{{ bluebanquise_supervision_home }}"
    create_home: false
  # Daemons get their groups at start
  notify: service <|> Restart bluebanquise-supervision services


################################################################################################
######################## DIRECTORIES

# Data: owned by the daemons user, nobody else can read it.
- name: "file <|> Create data directories"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ bluebanquise_supervision_user }}"
    group: "{{ bluebanquise_supervision_user }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ bluebanquise_supervision_home }}"
      mode: '0750'
    - path: "{{ bluebanquise_supervision_home }}/.ssh"
      mode: '0700'
    - path: "{{ bluebanquise_supervision_home }}/cluster"
      mode: '0750'
    - path: "{{ bluebanquise_supervision_hosts_data_path }}"
      mode: '0750'
    - path: "{{ bluebanquise_supervision_requests_path }}"
      mode: '0750'

# Code: owned by root, executed by the daemons user, so not writable by it. /etc/bluebanquise and
# /usr/lib/bluebanquise are shared with other roles, same settings as them.
- name: "file <|> Create code directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /etc/bluebanquise
    - /usr/lib/bluebanquise
    - "{{ bluebanquise_supervision_lib_path }}"
    - "{{ bluebanquise_supervision_lib_path }}/lib"

# Configuration: written by root only, readable by the daemons user (BMC credentials inside).
- name: "file <|> Create configuration directory"
  ansible.builtin.file:
    path: "{{ bluebanquise_supervision_conf_path }}"
    state: directory
    owner: root
    group: "{{ bluebanquise_supervision_user }}"
    mode: '0750'


################################################################################################
######################## SSH KEY

- name: "command <|> Generate SSH key of {{ bluebanquise_supervision_user }}"
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -q
      - -t
      - ed25519
      - -N
      - ""
      - -C
      - "{{ bluebanquise_supervision_user }}@{{ inventory_hostname }}"
      - -f
      - "{{ bluebanquise_supervision_ssh_key_path }}"
    creates: "{{ bluebanquise_supervision_ssh_key_path }}"

- name: "file <|> Set SSH key ownership"
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ bluebanquise_supervision_user }}"
    group: "{{ bluebanquise_supervision_user }}"
    mode: "{{ item.mode }}"
  loop:
    - path: "{{ bluebanquise_supervision_ssh_key_path }}"
      mode: '0600'
    - path: "{{ bluebanquise_supervision_ssh_key_path }}.pub"
      mode: '0644'

- name: "slurp <|> Read SSH public key"
  ansible.builtin.slurp:
    src: "{{ bluebanquise_supervision_ssh_key_path }}.pub"
  register: bluebanquise_supervision_public_key

# Probes connect to hosts with this key: it must be in the authorized_keys of the remote user
# (bluebanquise by default) of every supervised host, for example through os_admin_ssh_keys.
- name: "debug <|> Display SSH public key"
  ansible.builtin.debug:
    msg: "Add this key to os_admin_ssh_keys: {{ bluebanquise_supervision_public_key['content'] | b64decode | trim }}"


################################################################################################
######################## CONFIGURATION

- name: "template <|> Render configuration files"
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ bluebanquise_supervision_conf_path }}/{{ item }}"
    owner: root
    group: "{{ bluebanquise_supervision_user }}"
    mode: '0640'
  loop:
    - bluebanquise-supervision.yml
    - hosts.yml
  notify: service <|> Restart bluebanquise-supervision services
  tags:
    - template


################################################################################################
######################## WEBUI USERS

# Shared by all WebUI packs: every pack role writes the same file from the same variable
# (bluebanquise_webui_users). Read at every request by webui_auth.py: no restart needed.
- name: "assert <|> Check WebUI users"
  ansible.builtin.assert:
    that:
      - item['name'] is defined
      - item['password_hash'] | default('') | string | length > 0
      - item['role'] | default('') in ['viewer', 'operator', 'admin']
    fail_msg: "bluebanquise_webui_users: each user needs a name, a password_hash and a role (viewer, operator or admin)"
    quiet: true
  loop: "{{ bluebanquise_webui_users | default([], true) }}"
  loop_control:
    label: "{{ item['name'] | default('?') }}"

- name: "assert <|> Check WebUI users names are unique"
  ansible.builtin.assert:
    that:
      - bluebanquise_webui_users | default([], true) | map(attribute='name') | unique | length == bluebanquise_webui_users | default([], true) | length
    fail_msg: "bluebanquise_webui_users: a user name is used twice"
    quiet: true

- name: "file <|> Create WebUI users directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: bluebanquise-webui
    mode: '0750'
  loop:
    - /etc/bluebanquise/webui
    - /etc/bluebanquise/webui/users.d

- name: "template <|> Render WebUI users file"
  ansible.builtin.template:
    src: webui_users.yml.j2
    dest: /etc/bluebanquise/webui/users.yml
    owner: root
    group: bluebanquise-webui
    mode: '0640'
  tags:
    - template

- name: "template <|> Render sudoers file"
  ansible.builtin.template:
    src: sudoers.j2
    dest: /etc/sudoers.d/bluebanquise-supervision
    owner: root
    group: root
    mode: '0440'
    validate: /usr/sbin/visudo -cf %s
  when: bluebanquise_supervision_sudoers_commands | length > 0
  tags:
    - template

- name: "file <|> Remove sudoers file when no command is allowed"
  ansible.builtin.file:
    path: /etc/sudoers.d/bluebanquise-supervision
    state: absent
  when: bluebanquise_supervision_sudoers_commands | length == 0


################################################################################################
######################## CODE

- name: "copy <|> Copy shared library"
  ansible.builtin.copy:
    src: lib/
    dest: "{{ bluebanquise_supervision_lib_path }}/lib/"
    owner: root
    group: root
    mode: '0644'
  notify: service <|> Restart bluebanquise-supervision services

- name: "file <|> Create probes directory"
  ansible.builtin.file:
    path: "{{ bluebanquise_supervision_lib_path }}/probes"
    state: directory
    owner: root
    group: root
    mode: '0755'

# All files of the probes folder are copied, so a new probe only needs to be added there
- name: "copy <|> Copy probe scripts"
  ansible.builtin.copy:
    src: probes/
    dest: "{{ bluebanquise_supervision_lib_path }}/probes/"
    owner: root
    group: root
    mode: '0755'
  notify: service <|> Restart bluebanquise-supervision services

- name: "copy <|> Copy WebUI files"
  ansible.builtin.copy:
    src: webui/
    dest: "{{ bluebanquise_supervision_lib_path }}/webui/"
    owner: root
    group: root
    mode: '0644'
    directory_mode: '0755'
  notify: service <|> Restart bluebanquise-supervision services

- name: "copy <|> Copy command line tool"
  ansible.builtin.copy:
    src: bluebanquise-supervision
    dest: /usr/bin/bluebanquise-supervision
    owner: root
    group: root
    mode: '0755'

- name: "copy <|> Copy daemons"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/sbin/{{ item }}"
    owner: root
    group: root
    mode: '0755'
  loop: "{{ bluebanquise_supervision_services }}"
  notify: service <|> Restart bluebanquise-supervision services


################################################################################################
######################## SERVICES

- name: "template <|> Install systemd services"
  ansible.builtin.template:
    src: "{{ item }}.service.j2"
    dest: "/etc/systemd/system/{{ item }}.service"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ bluebanquise_supervision_services }}"
  notify: service <|> Restart bluebanquise-supervision services

- name: "systemd <|> Reload systemd configuration"
  ansible.builtin.systemd:
    daemon_reload: true
  tags:
    - service

- name: "meta <|> Run handler tasks to restart services"
  ansible.builtin.meta: flush_handlers

- name: "service <|> Manage bluebanquise-supervision services state"
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: "{{ (bluebanquise_supervision_enable_services | default(bb_enable_services) | default(true) | bool) | ternary(true, false) }}"
    state: "{{ (bluebanquise_supervision_start_services | default(bb_start_services) | default(true) | bool) | ternary('started', omit) }}"
  loop: "{{ bluebanquise_supervision_services }}"
  tags:
    - service


################################################################################################
######################## APACHE

# The WebUI and the REST API are served by the Apache of the http_server role, under
# /webui/supervision/. The daemon itself listens on 127.0.0.1 only.
- name: "stat <|> Check Apache configuration folder"
  ansible.builtin.stat:
    path: "{{ bluebanquise_supervision_apache_conf_path }}"
  register: bluebanquise_supervision_apache_conf_folder

- name: "assert <|> Check that Apache is installed"
  ansible.builtin.assert:
    that:
      - bluebanquise_supervision_apache_conf_folder.stat.exists
    fail_msg: "{{ bluebanquise_supervision_apache_conf_path }} does not exist: apply the http_server role on this host first."
    quiet: true

# On the RedHat family, httpd loads the proxy modules by default
- name: "apache2_module <|> Enable Apache proxy modules"
  community.general.apache2_module:
    name: "{{ item }}"
    state: present
  loop:
    - proxy
    - proxy_http
  when: ansible_facts.os_family != 'RedHat'
  notify: service <|> Reload Apache

- name: "template <|> Render Apache configuration"
  ansible.builtin.template:
    src: bluebanquise-webui-supervision.conf.j2
    dest: "{{ bluebanquise_supervision_apache_conf_path }}/bluebanquise-webui-supervision.conf"
    owner: root
    group: root
    mode: '0644'
  notify: service <|> Reload Apache
  tags:
    - template
