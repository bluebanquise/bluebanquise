---
- name: include_vars <|> Gather OS specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "vars/{{ ansible_facts.os_family }}.yml"
  tags:
    - always

- name: "package <|> Install packages"
  ansible.builtin.package:
    name: "{{ bluebanquise_operation_packages_to_install }}"
    state: present
  tags:
    - package


################################################################################################
######################## REQUIREMENTS

# Operation wraps bluebanquise-power (power, boot) and reads conman console logs: both roles
# must be applied on this host first.
- name: "stat <|> Check bluebanquise-power"
  ansible.builtin.stat:
    path: "{{ bluebanquise_operation_power_command }}"
  register: bluebanquise_operation_power_command_file

- name: "getent <|> Check conman user"
  ansible.builtin.getent:
    database: passwd
    key: "{{ bluebanquise_operation_user }}"
    fail_key: false

- name: "assert <|> Check that bluebanquise_power and conman roles were applied"
  ansible.builtin.assert:
    that:
      - bluebanquise_operation_power_command_file.stat.exists
      - ansible_facts.getent_passwd[bluebanquise_operation_user] is not none
    fail_msg: "Apply the bluebanquise.infrastructure.bluebanquise_power and bluebanquise.infrastructure.conman roles on this host first."
    quiet: true


################################################################################################
######################## USER

# Group of all WebUI packs daemons users: it can read the WebUI users file
- name: "group <|> Create bluebanquise-webui group"
  ansible.builtin.group:
    name: bluebanquise-webui
    system: true

# The daemons run as conman (conman role), which gets two more groups, each reading one file:
#  - bluebanquise-webui: the WebUI users file;
#  - bluebanquise-power (bluebanquise_power role): the bluebanquise-power configuration, BMC
#    credentials conman already has in conman.conf.
# Never the bluebanquise group: it can read the home of the bluebanquise user on some
# distributions (inventory, Ansible configuration).
- name: "user <|> Add {{ bluebanquise_operation_user }} user to bluebanquise-webui and bluebanquise-power groups"
  ansible.builtin.user:
    name: "{{ bluebanquise_operation_user }}"
    groups:
      - bluebanquise-webui
      - bluebanquise-power
    append: true
  # The daemons get their groups at start
  notify: service <|> Restart bluebanquise-operation services


################################################################################################
######################## DIRECTORIES

# Code: owned by root, executed by the daemons user, so not writable by it. /etc/bluebanquise and
# /usr/lib/bluebanquise are shared with other roles, same settings as them.
- name: "file <|> Create code directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /etc/bluebanquise
    - /usr/lib/bluebanquise
    - "{{ bluebanquise_operation_lib_path }}"
    - "{{ bluebanquise_operation_lib_path }}/lib"

# Configuration: written by root only, readable by the daemons user.
- name: "file <|> Create configuration directory"
  ansible.builtin.file:
    path: "{{ bluebanquise_operation_conf_path }}"
    state: directory
    owner: root
    group: "{{ bluebanquise_operation_user }}"
    mode: '0750'

# Data: power states, jobs and their output, written by the daemons.
- name: "file <|> Create data directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ bluebanquise_operation_user }}"
    group: "{{ bluebanquise_operation_user }}"
    mode: '0750'
  loop:
    - "{{ bluebanquise_operation_home }}"
    - "{{ bluebanquise_operation_jobs_path }}"
    - "{{ bluebanquise_operation_requests_path }}"


################################################################################################
######################## CONFIGURATION

- name: "template <|> Render configuration files"
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "{{ bluebanquise_operation_conf_path }}/{{ item }}"
    owner: root
    group: "{{ bluebanquise_operation_user }}"
    mode: '0640'
  loop:
    - bluebanquise-operation.yml
    - hosts.yml
  notify: service <|> Restart bluebanquise-operation services
  tags:
    - template


################################################################################################
######################## WEBUI USERS

# Shared by all WebUI packs: every pack role writes the same file from the same variable
# (bluebanquise_webui_users). Read at every request by webui_auth.py: no restart needed.
- name: "assert <|> Check WebUI users"
  ansible.builtin.assert:
    that:
      - item['name'] is defined
      - item['password_hash'] | default('') | string | length > 0
      - item['role'] | default('') in ['viewer', 'operator', 'admin']
    fail_msg: "bluebanquise_webui_users: each user needs a name, a password_hash and a role (viewer, operator or admin)"
    quiet: true
  loop: "{{ bluebanquise_webui_users | default([], true) }}"
  loop_control:
    label: "{{ item['name'] | default('?') }}"

- name: "assert <|> Check WebUI users names are unique"
  ansible.builtin.assert:
    that:
      - bluebanquise_webui_users | default([], true) | map(attribute='name') | unique | length == bluebanquise_webui_users | default([], true) | length
    fail_msg: "bluebanquise_webui_users: a user name is used twice"
    quiet: true

- name: "file <|> Create WebUI users directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: bluebanquise-webui
    mode: '0750'
  loop:
    - /etc/bluebanquise/webui
    - /etc/bluebanquise/webui/users.d

- name: "template <|> Render WebUI users file"
  ansible.builtin.template:
    src: webui_users.yml.j2
    dest: /etc/bluebanquise/webui/users.yml
    owner: root
    group: bluebanquise-webui
    mode: '0640'
  tags:
    - template


################################################################################################
######################## CODE

- name: "copy <|> Copy shared library"
  ansible.builtin.copy:
    src: lib/
    dest: "{{ bluebanquise_operation_lib_path }}/lib/"
    owner: root
    group: root
    mode: '0644'
  notify: service <|> Restart bluebanquise-operation services

- name: "copy <|> Copy WebUI files"
  ansible.builtin.copy:
    src: webui/
    dest: "{{ bluebanquise_operation_lib_path }}/webui/"
    owner: root
    group: root
    mode: '0644'
    directory_mode: '0755'
  notify: service <|> Restart bluebanquise-operation services

- name: "copy <|> Copy daemons"
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/usr/sbin/{{ item }}"
    owner: root
    group: root
    mode: '0755'
  loop: "{{ bluebanquise_operation_services }}"
  notify: service <|> Restart bluebanquise-operation services


################################################################################################
######################## SERVICES

- name: "template <|> Install systemd services"
  ansible.builtin.template:
    src: "{{ item }}.service.j2"
    dest: "/etc/systemd/system/{{ item }}.service"
    owner: root
    group: root
    mode: '0644'
  loop: "{{ bluebanquise_operation_services }}"
  notify: service <|> Restart bluebanquise-operation services

- name: "systemd <|> Reload systemd configuration"
  ansible.builtin.systemd:
    daemon_reload: true
  tags:
    - service

- name: "meta <|> Run handler tasks to restart services"
  ansible.builtin.meta: flush_handlers

- name: "service <|> Manage bluebanquise-operation services state"
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: "{{ (bluebanquise_operation_enable_services | default(bb_enable_services) | default(true) | bool) | ternary(true, false) }}"
    state: "{{ (bluebanquise_operation_start_services | default(bb_start_services) | default(true) | bool) | ternary('started', omit) }}"
  loop: "{{ bluebanquise_operation_services }}"
  tags:
    - service


################################################################################################
######################## APACHE

# The WebUI is served by the Apache of the http_server role, under /webui/operation/. The daemon
# itself listens on 127.0.0.1 only.
- name: "stat <|> Check Apache configuration folder"
  ansible.builtin.stat:
    path: "{{ bluebanquise_operation_apache_conf_path }}"
  register: bluebanquise_operation_apache_conf_folder

- name: "assert <|> Check that Apache is installed"
  ansible.builtin.assert:
    that:
      - bluebanquise_operation_apache_conf_folder.stat.exists
    fail_msg: "{{ bluebanquise_operation_apache_conf_path }} does not exist: apply the http_server role on this host first."
    quiet: true

# On the RedHat family, httpd loads the proxy modules by default
- name: "apache2_module <|> Enable Apache proxy modules"
  community.general.apache2_module:
    name: "{{ item }}"
    state: present
  loop:
    - proxy
    - proxy_http
  when: ansible_facts.os_family != 'RedHat'
  notify: service <|> Reload Apache

- name: "template <|> Render Apache configuration"
  ansible.builtin.template:
    src: bluebanquise-webui-operation.conf.j2
    dest: "{{ bluebanquise_operation_apache_conf_path }}/bluebanquise-webui-operation.conf"
    owner: root
    group: root
    mode: '0644'
  notify: service <|> Reload Apache
  tags:
    - template
