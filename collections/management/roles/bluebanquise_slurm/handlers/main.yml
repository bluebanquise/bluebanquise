---
# Daemons read their configuration only at startup: any change restarts them all. A drain or a
# resume running in the worker at that moment ends failed.
- name: service <|> Restart bluebanquise-slurm services
  ansible.builtin.service:
    name: "{{ item }}"
    state: restarted
  loop: "{{ bluebanquise_slurm_services }}"
  when:
    - "'service' not in ansible_skip_tags"
    - bluebanquise_slurm_start_services | default(bb_start_services) | default(true) | bool

# Apache serves the WebUI. Handlers run in the order they are defined: the configuration is
# checked first, so that an invalid configuration never stops a running Apache (which also serves
# PXE files and repositories). A reload does not cut current downloads.
- name: command <|> Check Apache configuration
  ansible.builtin.command: "{{ bluebanquise_slurm_apache_configtest_command }}"
  changed_when: false
  listen: service <|> Reload Apache
  when:
    - "'service' not in ansible_skip_tags"
    - http_server_start_services | default(bb_start_services) | default(true) | bool

- name: service <|> Reload Apache
  ansible.builtin.service:
    name: "{{ bluebanquise_slurm_apache_service }}"
    state: reloaded
  when:
    - "'service' not in ansible_skip_tags"
    - http_server_start_services | default(bb_start_services) | default(true) | bool
