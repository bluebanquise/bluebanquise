networks:
  net-admin:
    prefix: 16
    subnet: 10.10.0.0
    dhcp_server: true
    dns_server: true
    services_ip: 10.10.0.1
    gateway: 10.10.0.1
    services:
      dns4:
        - ip4: 10.10.0.1
          hostname: mg1-dns
      pxe4:
        - ip4: 10.10.0.1
          hostname: mg1-pxe
      ntp4:
        - ip4: 10.10.0.1
          hostname: mg1-ntp
      log4:
        - ip4: 10.10.0.1
          hostname: mg1-log
  net-test:
    prefix: 16
    subnet: 10.11.0.0
